name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RELEASE_NODE_VERSION: 22.23.1

jobs:
  source-contract:
    name: Source and release contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - name: Install locked dependencies
        working-directory: cli
        run: npm ci
      - name: Validate version, lockfile, changelog, and release contracts
        working-directory: cli
        run: |
          npm run release:validate
          npm run test:release
      - name: Validate workflow security contracts
        run: node --test .github/scripts/verify-release-workflow-security.test.js
      - name: Reject whitespace and patch corruption
        run: git diff --check
      - name: Audit production dependency graph
        working-directory: cli
        run: npm audit --omit=dev --audit-level=high
      - name: Build without optional native dependencies
        working-directory: cli
        run: |
          npm ci --omit=optional
          npm run build

  lint:
    name: Typecheck and lint ratchet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - working-directory: cli
        run: |
          npm run typecheck
          npm run lint:ratchet

  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: [22.23.1, 24.18.0, 26.5.0]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - working-directory: cli
        run: npm ci
      - name: Run full suite
        if: matrix.os != 'ubuntu-24.04' || matrix.node != '24.18.0'
        working-directory: cli
        run: npm test -- --runInBand
      - name: Run full suite with enforced coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '24.18.0'
        working-directory: cli
        run: npm test -- --coverage --runInBand
      - name: Upload coverage
        if: matrix.os == 'ubuntu-24.04' && matrix.node == '24.18.0' && always()
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: cli/coverage/lcov.info
          flags: cli
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  npm-artifact:
    name: Immutable npm artifact
    runs-on: ubuntu-24.04
    needs: [source-contract, lint, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - name: Build exact publish handoff
        working-directory: cli
        run: npm run release:package -- --output-dir ../release-artifacts
      - name: Verify exact publish handoff
        working-directory: cli
        run: npm run release:verify-npm -- --artifact-dir ../release-artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guardscan-npm-${{ github.sha }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

  installed-package:
    name: npm package smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    needs: [npm-artifact]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: [22.23.1, 24.18.0]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guardscan-npm-${{ github.sha }}
          path: release-artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - working-directory: cli
        run: npm ci
      - working-directory: cli
        run: npm run release:verify-npm -- --artifact-dir ../release-artifacts
      - working-directory: cli
        run: npm run test:package
        env:
          GUARDSCAN_PACKAGE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifacts

  package-manager:
    name: Package manager smoke (${{ matrix.id }})
    runs-on: ubuntu-24.04
    needs: [npm-artifact]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: npm
            manager: npm
          - id: pnpm
            manager: pnpm
            version: 10.34.0
          - id: yarn-modern
            manager: yarn
            version: 4.9.2
          - id: yarn-classic
            manager: yarn
            version: 1.22.22
          - id: bun
            manager: bun
            version: 1.3.14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: guardscan-npm-${{ github.sha }}
          path: release-artifacts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - if: matrix.manager == 'pnpm'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: ${{ matrix.version }}
      - if: matrix.manager == 'yarn'
        run: |
          corepack enable
          corepack prepare yarn@${{ matrix.version }} --activate
      - if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ matrix.version }}
      - working-directory: cli
        run: npm run test:package-manager -- --manager ${{ matrix.manager }}
        env:
          GUARDSCAN_PACKAGE_ARTIFACT_DIR: ${{ github.workspace }}/release-artifacts

  standalone:
    name: Required standalone SEA (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    needs: [source-contract, lint, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            os: ubuntu-24.04
          - id: linux-arm64
            os: ubuntu-24.04-arm
          - id: macos-arm64
            os: macos-15
          - id: macos-x64
            os: macos-15-intel
          - id: windows-x64
            os: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - working-directory: cli
        run: npm run build
      - name: Build and smoke host SEA with Node absent from PATH
        working-directory: cli
        run: npm run release:build -- --kind standalone --output-dir ../standalone-build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: guardscan-unsigned-${{ matrix.id }}-${{ github.sha }}
          path: standalone-build/
          if-no-files-found: error
          retention-days: 7

  integration:
    name: Offline CLI integration
    runs-on: ubuntu-24.04
    needs: [npm-artifact]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - working-directory: cli
        run: npm run build
      - working-directory: cli
        run: npm link
      - name: Exercise static scan and both SBOM formats
        working-directory: cli
        run: |
          guardscan --version
          guardscan --help
          guardscan --no-telemetry scan --offline --no-cve --skip-ai --ci --format json --output guardscan-scan.json --max-findings 10000
          guardscan --no-telemetry sbom --offline --format spdx --output guardscan.spdx.json
          guardscan --no-telemetry sbom --offline --format cyclonedx --output guardscan.cyclonedx.json

  release-gate:
    name: Release gate
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - source-contract
      - lint
      - test
      - npm-artifact
      - installed-package
      - package-manager
      - standalone
      - integration
    steps:
      - name: Require every release quality gate
        env:
          RESULTS: >-
            ${{ join(needs.*.result, ' ') }}
        run: |
          test "$RESULTS" = "success success success success success success success success"
