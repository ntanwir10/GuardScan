name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-bootstrap:
    name: Release bootstrap contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install locked YAML parser
        working-directory: cli
        run: npm ci
      - name: Verify inert bootstrap provenance and contracts
        run: node --test .github/scripts/verify-inert-release-bootstrap.test.js
      - name: Reject whitespace and patch corruption
        run: git diff --check

  lint:
    name: Typecheck unchanged 1.0.5 source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: "**/package-lock.json"
      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci
      - name: Typecheck CLI
        working-directory: cli
        run: npm run typecheck

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        working-directory: cli
        run: npm ci
      - name: Build TypeScript (required for E2E tests)
        working-directory: cli
        run: npm run build
      - name: Run tests with coverage
        working-directory: cli
        run: npm test -- --coverage
      - name: Upload coverage to Codecov
        if: matrix.node-version == 20 && always()
        continue-on-error: true
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          files: ./cli/coverage/lcov.info
          flags: cli
          name: cli-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build-cli:
    name: Build CLI
    runs-on: ubuntu-latest
    needs: [test-cli]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: cli/package-lock.json
      - name: Install dependencies
        working-directory: cli
        run: npm ci
      - name: Build TypeScript
        working-directory: cli
        run: npm run build
      - name: Verify build artifacts
        working-directory: cli
        run: |
          ls -la dist/
          test -f dist/index.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-dist
          path: cli/dist/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run npm audit (CLI)
        working-directory: cli
        run: npm audit --audit-level=moderate || true
        continue-on-error: true

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-cli]
    if: always()
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "18"
      - name: Install CLI dependencies
        working-directory: cli
        run: npm ci
      - name: Build CLI
        working-directory: cli
        run: npm run build
      - name: Link CLI globally
        working-directory: cli
        run: npm link
        continue-on-error: true
      - name: Test CLI commands
        run: |
          guardscan --version || echo "guardscan --version failed"
          guardscan --help || echo "guardscan --help failed"
          guardscan init --no-telemetry || echo "guardscan init failed"
        continue-on-error: true
      - name: Run self-scan
        working-directory: cli
        run: guardscan security --files "src/**/*.ts" --no-telemetry || echo "Self-scan failed"
        continue-on-error: true
