name: Reusable signed release build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
      channel:
        type: string
        required: true
      mode:
        type: string
        required: false
        default: production
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
      APPLE_NOTARY_PRIVATE_KEY:
        required: false

permissions:
  contents: read

env:
  RELEASE_NODE_VERSION: 22.23.1
  RELEASE_INPUT_REF: ${{ inputs.ref }}
  RELEASE_INPUT_TAG: ${{ inputs.tag }}
  RELEASE_INPUT_MODE: ${{ inputs.mode }}

jobs:
  quality:
    name: Exact-source release gate
    if: inputs.mode == 'production'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - name: Run complete local release gate
        working-directory: cli
        run: |
          npm run release:validate -- --tag "$RELEASE_INPUT_TAG"
          npm run typecheck
          npm run build
          npm test -- --coverage --runInBand
          npm run lint:ratchet
          npm audit --omit=dev --audit-level=high
          npm run test:release
          npm run test:package
          npm run test:package-manager -- --manager npm
      - run: git diff --check

  npm-build:
    name: Unprivileged npm source build
    if: inputs.mode == 'production'
    runs-on: ubuntu-24.04
    needs: [quality]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - working-directory: cli
        run: npm run release:package -- --output-dir ../npm-artifact
      - working-directory: cli
        run: npm run release:verify-npm -- --artifact-dir ../npm-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-npm-input-${{ inputs.tag }}
          path: npm-artifact/
          if-no-files-found: error
          retention-days: 30

  npm-finalize:
    name: Attest npm artifact
    if: inputs.mode == 'production'
    runs-on: ubuntu-24.04
    needs: [quality, npm-build]
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_BUILD_WORKFLOW_SHA: ${{ job.workflow_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci --ignore-scripts
      - id: download-npm-input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-npm-input-${{ inputs.tag }}
          path: npm-artifact
      - name: Require artifact-service digest for npm input
        env:
          ARTIFACT_DIGEST: ${{ steps.download-npm-input.outputs.artifact-digest }}
        run: test -n "$ARTIFACT_DIGEST"
      - name: Verify npm artifact with trusted default-branch tooling
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_COMMIT: ${{ inputs.ref }}
        run: |
          node cli/scripts/release/index.js verify-npm-artifact \
            --package-root "$GITHUB_WORKSPACE/source/cli" \
            --repository-root "$GITHUB_WORKSPACE/source" \
            --schema-root "$GITHUB_WORKSPACE/cli" \
            --tag "$EXPECTED_TAG" --commit "$EXPECTED_COMMIT" \
            --artifact-dir "$GITHUB_WORKSPACE/npm-artifact"
      - name: Validate exact source binding before attestation
        env:
          EXPECTED_REF: ${{ inputs.ref }}
          EXPECTED_TAG: ${{ inputs.tag }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const metadata = JSON.parse(fs.readFileSync('npm-artifact/npm-artifact.json'));
          const sourceCommit = cp.execFileSync('git', ['-C', 'source', 'rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          if (metadata.commit !== process.env.EXPECTED_REF || metadata.tag !== process.env.EXPECTED_TAG) {
            throw new Error('npm artifact metadata is not bound to the requested source');
          }
          if (sourceCommit !== process.env.EXPECTED_REF) throw new Error('source checkout is not the requested commit');
          NODE
      - name: Attest exact npm tarball
        id: attest-npm
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: npm-artifact/*.tgz
      - name: Bind npm tarball to source and provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest-npm.outputs.bundle-path }}
          SIGNER_WORKFLOW_SHA: ${{ env.RELEASE_BUILD_WORKFLOW_SHA }}
          SOURCE_COMMIT: ${{ inputs.ref }}
          BUNDLE_FILE: npm.provenance.sigstore.json
          BUNDLE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/npm.provenance.sigstore.json
        run: |
          TARBALL="$(find npm-artifact -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$TARBALL" && test -f "$BUNDLE_PATH"
          gh attestation verify "$TARBALL" --bundle "$BUNDLE_PATH" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" --signer-digest "$SIGNER_WORKFLOW_SHA" --predicate-type 'https://slsa.dev/provenance/v1' --format json > npm-attestation-verification.json
          cp "$BUNDLE_PATH" "npm-artifact/$BUNDLE_FILE"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const {createVerifiedAttestationEvidence} = require('./cli/scripts/release/provenance');
          const metadata = JSON.parse(fs.readFileSync('npm-artifact/npm-artifact.json'));
          if (metadata.commit !== process.env.SOURCE_COMMIT) throw new Error('npm attestation source binding mismatch');
          const provenance = createVerifiedAttestationEvidence({
            bundleFile: path.join('npm-artifact', process.env.BUNDLE_FILE),
            subjectFile: path.join('npm-artifact', metadata.filename),
            source: {version: metadata.version, tag: metadata.tag, commit: metadata.commit},
            url: process.env.BUNDLE_URL,
            signerDigest: process.env.SIGNER_WORKFLOW_SHA,
            verification: JSON.parse(fs.readFileSync('npm-attestation-verification.json')),
          });
          const artifact = {
            id: 'npm:guardscan', kind: 'npm-tarball', filename: metadata.filename,
            size: metadata.size, sha256: metadata.sha256,
            source: {version: metadata.version, tag: metadata.tag, commit: metadata.commit},
            capabilities: {coreScan: true, sbom: true, chartRendering: true, accurateTokenCounting: true},
            url: `https://registry.npmjs.org/guardscan/-/${metadata.filename}`,
            integrity: metadata.integrity,
            provenance,
          };
          fs.writeFileSync('npm-artifact/npm-artifact.metadata.json', `${JSON.stringify({
            schemaVersion: 'guardscan.artifact-metadata.v1', version: metadata.version,
            tag: metadata.tag, commit: metadata.commit, createdAt: metadata.createdAt, artifact,
          }, null, 2)}\n`);
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-npm-${{ inputs.tag }}
          path: npm-artifact/
          if-no-files-found: error
          retention-days: 30

  native-build:
    name: Unprivileged native source build ${{ matrix.id }}
    if: inputs.mode == 'production'
    runs-on: ${{ matrix.runner }}
    needs: [quality]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: linux-x64-glibc, runner: ubuntu-24.04, os: linux, arch: x64, libc: glibc, executable: guardscan}
          - {id: linux-arm64-glibc, runner: ubuntu-24.04-arm, os: linux, arch: arm64, libc: glibc, executable: guardscan}
          - {id: darwin-arm64, runner: macos-15, os: darwin, arch: arm64, libc: '', executable: guardscan}
          - {id: darwin-x64, runner: macos-15-intel, os: darwin, arch: x64, libc: '', executable: guardscan}
          - {id: windows-x64, runner: windows-2025, os: windows, arch: x64, libc: '', executable: guardscan.exe}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - working-directory: cli
        run: npm run build
      - name: Build unsigned source SEA
        working-directory: cli
        run: npm run release:build -- --kind standalone --output-dir ../standalone
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-native-input-${{ matrix.id }}-${{ inputs.tag }}
          path: standalone/
          if-no-files-found: error
          retention-days: 30

  native-finalize:
    name: Sign and attest native ${{ matrix.id }}
    if: inputs.mode == 'production'
    runs-on: ${{ matrix.runner }}
    needs: [quality, native-build]
    environment: ${{ matrix.os == 'darwin' && 'apple-notarization' || matrix.os == 'windows' && 'windows-signing' || inputs.channel == 'rc' && 'release-rc' || 'release-stable' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_BUILD_WORKFLOW_SHA: ${{ job.workflow_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: linux-x64-glibc, runner: ubuntu-24.04, os: linux, arch: x64, libc: glibc, executable: guardscan}
          - {id: linux-arm64-glibc, runner: ubuntu-24.04-arm, os: linux, arch: arm64, libc: glibc, executable: guardscan}
          - {id: darwin-arm64, runner: macos-15, os: darwin, arch: arm64, libc: '', executable: guardscan}
          - {id: darwin-x64, runner: macos-15-intel, os: darwin, arch: x64, libc: '', executable: guardscan}
          - {id: windows-x64, runner: windows-2025, os: windows, arch: x64, libc: '', executable: guardscan.exe}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci --ignore-scripts
      - id: download-native-input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-native-input-${{ matrix.id }}-${{ inputs.tag }}
          path: standalone
      - name: Require artifact-service digest for native input
        env:
          ARTIFACT_DIGEST: ${{ steps.download-native-input.outputs.artifact-digest }}
        run: test -n "$ARTIFACT_DIGEST"
      - name: Validate native input structure and digest before signing
        env:
          EXPECTED_REF: ${{ inputs.ref }}
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_LIBC: ${{ matrix.libc }}
          EXPECTED_EXECUTABLE: ${{ matrix.executable }}
        run: |
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const cp = require('child_process');
          const path = require('path');
          const entries = fs.readdirSync('standalone');
          const allowed = new Set([process.env.EXPECTED_EXECUTABLE, 'standalone-prototype.json']);
          if (entries.some(name => !allowed.has(name))) throw new Error(`unexpected native input file: ${entries.join(', ')}`);
          for (const name of entries) {
            const stat = fs.lstatSync(path.join('standalone', name));
            if (!stat.isFile()) throw new Error(`native input is not a regular file: ${name}`);
          }
          const prototype = JSON.parse(fs.readFileSync('standalone/standalone-prototype.json'));
          const sourceCommit = cp.execFileSync('git', ['-C', 'source', 'rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          if (sourceCommit !== process.env.EXPECTED_REF || prototype.commit !== process.env.EXPECTED_REF
              || prototype.tag !== process.env.EXPECTED_TAG || prototype.version !== process.env.EXPECTED_TAG.replace(/^v/, '')
              || prototype.platform?.os !== process.env.EXPECTED_OS || prototype.platform?.arch !== process.env.EXPECTED_ARCH
              || (prototype.platform?.libc || '') !== process.env.EXPECTED_LIBC
              || prototype.executable?.filename !== process.env.EXPECTED_EXECUTABLE) throw new Error('native input metadata binding failed');
          const executable = fs.readFileSync(path.join('standalone', process.env.EXPECTED_EXECUTABLE));
          const digest = crypto.createHash('sha256').update(executable).digest('hex');
          if (executable.length <= 0 || executable.length !== prototype.executable.size || digest !== prototype.executable.sha256) throw new Error('native executable size or SHA-256 does not match prototype');
          NODE
      - name: Install Sigstore cosign
        if: matrix.os == 'linux'
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Keyless-sign Linux executable
        if: matrix.os == 'linux'
        shell: bash
        run: |
          cosign sign-blob --yes --bundle standalone/guardscan.sigstore.json standalone/guardscan
          cosign verify-blob --bundle standalone/guardscan.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@refs/heads/main" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-sha "$RELEASE_BUILD_WORKFLOW_SHA" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" standalone/guardscan
      - name: Import Apple Developer ID certificate
        if: matrix.os == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/guardscan-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_P12" | openssl base64 -d -A > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN"
      - name: Sign, notarize, staple, and verify macOS executable
        if: matrix.os == 'darwin'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/guardscan-signing.keychain-db"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -v team="($APPLE_TEAM_ID)" 'index($0, "Developer ID Application:") && index($0, team) {print $2}')"
          test -n "$IDENTITY"
          test "$(printf '%s\n' "$IDENTITY" | wc -l | tr -d ' ')" = 1
          codesign --force --options runtime --timestamp --sign "$IDENTITY" standalone/guardscan
          codesign --verify --deep --strict --verbose=2 standalone/guardscan
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          mkdir "$RUNNER_TEMP/notarization-volume"
          cp standalone/guardscan "$RUNNER_TEMP/notarization-volume/guardscan"
          hdiutil create -volname GuardScan -srcfolder "$RUNNER_TEMP/notarization-volume" -format UDZO "$RUNNER_TEMP/guardscan.dmg"
          xcrun notarytool submit "$RUNNER_TEMP/guardscan.dmg" --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --output-format json > "$RUNNER_TEMP/notary.json"
          test "$(node -p 'require(process.argv[1]).status' "$RUNNER_TEMP/notary.json")" = Accepted
          xcrun stapler staple "$RUNNER_TEMP/guardscan.dmg"
          xcrun stapler validate "$RUNNER_TEMP/guardscan.dmg"
          spctl --assess --type execute --verbose=4 standalone/guardscan
          cp "$RUNNER_TEMP/notary.json" standalone/apple-notarization.json
          cp "$RUNNER_TEMP/guardscan.dmg" standalone/stapled-notarization.dmg
          codesign -dvvv standalone/guardscan 2> standalone/apple-code-signing.txt
      - name: Remove ephemeral Apple signing material
        if: always() && matrix.os == 'darwin'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/guardscan-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/AuthKey.p8"
      - name: Azure OIDC login
        if: matrix.os == 'windows'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticode-sign through Azure Artifact Signing
        if: matrix.os == 'windows'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\standalone\guardscan.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
      - name: Verify Authenticode signature and timestamp
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature standalone\guardscan.exe
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode status: $($signature.Status)" }
          if ($null -eq $signature.TimeStamperCertificate) { throw 'Authenticode timestamp is missing' }
          $signature | Format-List * | Out-File standalone\authenticode.txt
      - name: Generate SBOM with trusted default-branch tooling
        shell: bash
        run: |
          ARGS=(--kind artifact-sbom --output-dir standalone-sbom --executable "standalone/${{ matrix.executable }}" --platform-os "${{ matrix.os }}" --platform-arch "${{ matrix.arch }}" --timestamp "$(git -C source show -s --format=%cI "$RELEASE_INPUT_REF")" --package-root "$GITHUB_WORKSPACE/source/cli" --repository-root "$GITHUB_WORKSPACE/source" --schema-root "$GITHUB_WORKSPACE/cli")
          if [ -n "${{ matrix.libc }}" ]; then ARGS+=(--platform-libc "${{ matrix.libc }}"); fi
          node cli/scripts/release/index.js build "${ARGS[@]}"
      - name: Attest signed executable
        id: attest-executable
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: standalone/${{ matrix.executable }}
      - name: Create verified evidence descriptor
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_TAG: ${{ inputs.tag }}
          ARTIFACT_VERSION: ${{ inputs.tag }}
          ARTIFACT_OS: ${{ matrix.os }}
          ARTIFACT_ARCH: ${{ matrix.arch }}
          ARTIFACT_LIBC: ${{ matrix.libc }}
          ARTIFACT_ID: ${{ matrix.id }}
          BUNDLE_PATH: ${{ steps.attest-executable.outputs.bundle-path }}
          SIGNER_WORKFLOW_SHA: ${{ env.RELEASE_BUILD_WORKFLOW_SHA }}
          BUNDLE_FILE: ${{ matrix.id }}.executable.provenance.sigstore.json
          BUNDLE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ matrix.id }}.executable.provenance.sigstore.json
        run: |
          test -f "$BUNDLE_PATH"
          gh attestation verify "standalone/${{ matrix.executable }}" --bundle "$BUNDLE_PATH" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" --signer-digest "$SIGNER_WORKFLOW_SHA" --predicate-type 'https://slsa.dev/provenance/v1' --format json > executable-attestation-verification.json
          cp "$BUNDLE_PATH" "standalone/$BUNDLE_FILE"
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const path = require('path');
          const {createVerifiedAttestationEvidence} = require('./cli/scripts/release/provenance');
          const version = process.env.ARTIFACT_VERSION.replace(/^v/, '');
          const prototype = JSON.parse(fs.readFileSync('standalone/standalone-prototype.json'));
          const commit = cp.execFileSync('git', ['-C', 'source', 'rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          if (prototype.version !== version || prototype.tag !== process.env.ARTIFACT_TAG || prototype.commit !== commit) throw new Error('native prototype source binding mismatch');
          const smoke = prototype.smoke;
          if (smoke?.valid !== true || smoke.nodeAbsentFromPath !== true || smoke.packageManagersAbsentFromPath !== true || smoke.optionalCapabilitiesUnavailableSafely !== true) throw new Error('native smoke evidence is incomplete');
          const sbom = JSON.parse(fs.readFileSync('standalone-sbom/artifact-sbom.json'));
          const signatures = process.env.ARTIFACT_OS === 'darwin' ? ['apple-code-signing', 'apple-notarization'] : [process.env.ARTIFACT_OS === 'windows' ? 'authenticode' : 'sigstore'];
          const signatureFile = {'apple-code-signing': 'apple-code-signing.txt', 'apple-notarization': 'apple-notarization.json', authenticode: 'authenticode.txt', sigstore: 'guardscan.sigstore.json'};
          const provenance = createVerifiedAttestationEvidence({
            bundleFile: path.join('standalone', process.env.BUNDLE_FILE),
            subjectFile: path.join('standalone', process.env.ARTIFACT_OS === 'windows' ? 'guardscan.exe' : 'guardscan'),
            source: {version, tag: process.env.ARTIFACT_TAG, commit},
            url: process.env.BUNDLE_URL,
            signerDigest: process.env.SIGNER_WORKFLOW_SHA,
            verification: JSON.parse(fs.readFileSync('executable-attestation-verification.json')),
          });
          fs.writeFileSync('standalone/evidence.json', `${JSON.stringify({schemaVersion: 'guardscan.standalone-evidence.v1', version, tag: process.env.ARTIFACT_TAG, commit, platform: {os: process.env.ARTIFACT_OS, arch: process.env.ARTIFACT_ARCH, ...(process.env.ARTIFACT_LIBC ? {libc: process.env.ARTIFACT_LIBC} : {})}, optionalCapabilities: smoke.optionalCapabilities, signatures: signatures.map(type => ({type, url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.ARTIFACT_TAG}/${process.env.ARTIFACT_ID}.${signatureFile[type]}`, verified: true})), sboms: sbom.files.map(file => ({type: file.format, url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.ARTIFACT_TAG}/${file.filename}`, sha256: file.sha256, verified: true})), provenance}, null, 2)}\n`);
          NODE
      - name: Archive signed executable with trusted tooling
        shell: bash
        run: |
          ARGS=(--kind archive --output-dir native-output --executable "standalone/${{ matrix.executable }}" --evidence standalone/evidence.json --platform-os "${{ matrix.os }}" --platform-arch "${{ matrix.arch }}" --timestamp "$(git -C source show -s --format=%cI "$RELEASE_INPUT_REF")" --package-root "$GITHUB_WORKSPACE/source/cli" --repository-root "$GITHUB_WORKSPACE/source" --schema-root "$GITHUB_WORKSPACE/cli")
          if [ -n "${{ matrix.libc }}" ]; then ARGS+=(--platform-libc "${{ matrix.libc }}"); fi
          node cli/scripts/release/index.js build "${ARGS[@]}"
          cp standalone-sbom/guardscan-*.json native-output/
          cp "standalone/${{ matrix.id }}.executable.provenance.sigstore.json" native-output/
          for file in guardscan.sigstore.json apple-code-signing.txt apple-notarization.json authenticode.txt; do [ -f "standalone/$file" ] && cp "standalone/$file" "native-output/${{ matrix.id }}.$file"; done
      - name: Attest signed archive
        id: attest-archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: native-output/guardscan-*
      - name: Bind archive metadata to archive attestation
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest-archive.outputs.bundle-path }}
          SIGNER_WORKFLOW_SHA: ${{ env.RELEASE_BUILD_WORKFLOW_SHA }}
          SOURCE_COMMIT: ${{ inputs.ref }}
          BUNDLE_FILE: ${{ matrix.id }}.archive.provenance.sigstore.json
          BUNDLE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ matrix.id }}.archive.provenance.sigstore.json
        run: |
          test -f "$BUNDLE_PATH"
          ARCHIVE="$(node -e 'const fs=require("fs"); const file=fs.readdirSync("native-output").find(name=>name.endsWith(".metadata.json")); process.stdout.write(require(`./native-output/${file}`).artifact.filename)')"
          test -f "native-output/$ARCHIVE"
          gh attestation verify "native-output/$ARCHIVE" --bundle "$BUNDLE_PATH" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" --signer-digest "$SIGNER_WORKFLOW_SHA" --predicate-type 'https://slsa.dev/provenance/v1' --format json > archive-attestation-verification.json
          cp "$BUNDLE_PATH" "native-output/$BUNDLE_FILE"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const {createVerifiedAttestationEvidence} = require('./cli/scripts/release/provenance');
          const file = fs.readdirSync('native-output').find(name => name.endsWith('.metadata.json'));
          const metadata = JSON.parse(fs.readFileSync(`native-output/${file}`));
          if (metadata.commit !== process.env.SOURCE_COMMIT) throw new Error('archive attestation source binding mismatch');
          metadata.artifact.provenance = createVerifiedAttestationEvidence({
            bundleFile: path.join('native-output', process.env.BUNDLE_FILE),
            subjectFile: path.join('native-output', metadata.artifact.filename),
            source: {version: metadata.version, tag: metadata.tag, commit: metadata.commit},
            url: process.env.BUNDLE_URL,
            signerDigest: process.env.SIGNER_WORKFLOW_SHA,
            verification: JSON.parse(fs.readFileSync('archive-attestation-verification.json')),
          });
          fs.writeFileSync(`native-output/${file}`, `${JSON.stringify(metadata, null, 2)}\n`);
          NODE
      - name: Build exact signed Python wheel with trusted tooling
        shell: bash
        run: |
          ARGS=(--kind python-wheel --output-dir wheel-output --executable "standalone/${{ matrix.executable }}" --platform-os "${{ matrix.os }}" --platform-arch "${{ matrix.arch }}" --timestamp "$(git -C source show -s --format=%cI "$RELEASE_INPUT_REF")" --package-root "$GITHUB_WORKSPACE/source/cli" --repository-root "$GITHUB_WORKSPACE/source" --schema-root "$GITHUB_WORKSPACE/cli")
          if [ -n "${{ matrix.libc }}" ]; then ARGS+=(--platform-libc "${{ matrix.libc }}"); fi
          node cli/scripts/release/index.js build "${ARGS[@]}"
      - name: Attest and cryptographically verify Python wheel
        id: attest-wheel
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: wheel-output/*.whl
      - name: Verify Python wheel bundle and write bound evidence
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest-wheel.outputs.bundle-path }}
          SIGNER_WORKFLOW_SHA: ${{ env.RELEASE_BUILD_WORKFLOW_SHA }}
          SOURCE_COMMIT: ${{ inputs.ref }}
          BUNDLE_FILE: ${{ matrix.id }}.wheel.provenance.sigstore.json
          BUNDLE_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/${{ matrix.id }}.wheel.provenance.sigstore.json
        run: |
          WHEEL_FILE="$(find wheel-output -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$WHEEL_FILE" && test -f "$BUNDLE_PATH"
          gh attestation verify "$WHEEL_FILE" --bundle "$BUNDLE_PATH" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-build.yml" --signer-digest "$SIGNER_WORKFLOW_SHA" --predicate-type 'https://slsa.dev/provenance/v1' --format json > wheel-attestation-verification.json
          cp "$BUNDLE_PATH" "wheel-output/$BUNDLE_FILE"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const {createVerifiedAttestationEvidence} = require('./cli/scripts/release/provenance');
          const wheel = fs.readdirSync('wheel-output').find(name => name.endsWith('.whl'));
          const meta = fs.readdirSync('wheel-output').find(name => name.endsWith('.whl.json'));
          const verified = JSON.parse(fs.readFileSync('wheel-attestation-verification.json'));
          if (!Array.isArray(verified) || verified.length < 1) throw new Error('wheel attestation returned no verified statement');
          const metadata = JSON.parse(fs.readFileSync(path.join('wheel-output', meta)));
          if (metadata.commit !== process.env.SOURCE_COMMIT || metadata.tag !== process.env.RELEASE_INPUT_TAG) throw new Error('wheel source binding mismatch');
          const evidence = createVerifiedAttestationEvidence({
            bundleFile: path.join('wheel-output', process.env.BUNDLE_FILE),
            subjectFile: path.join('wheel-output', wheel),
            source: {version: metadata.version, tag: metadata.tag, commit: metadata.commit},
            url: process.env.BUNDLE_URL,
            signerDigest: process.env.SIGNER_WORKFLOW_SHA,
            verification: verified,
          });
          if (!/^https:\/\//.test(evidence.url || '')) throw new Error('attestation URL is not HTTPS');
          fs.writeFileSync('wheel-output/python-wheel-provenance.json', `${JSON.stringify(evidence, null, 2)}\n`, {flag: 'wx'});
          NODE
      - name: Bind wheel to standalone and provenance with trusted tooling
        run: |
          WHEEL_META="$(find wheel-output -name '*.whl.json' -print -quit)"
          STANDALONE_META="$(find native-output -name '*.metadata.json' -print -quit)"
          node cli/scripts/release/index.js build --kind python-wheel-artifact --wheel-metadata "$WHEEL_META" --standalone-metadata "$STANDALONE_META" --provenance-evidence wheel-output/python-wheel-provenance.json --output wheel-output/python-wheel.metadata.json --package-root "$GITHUB_WORKSPACE/source/cli" --repository-root "$GITHUB_WORKSPACE/source" --schema-root "$GITHUB_WORKSPACE/cli"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-native-${{ matrix.id }}-${{ inputs.tag }}
          path: |
            native-output/
            wheel-output/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Manifest and signed aggregate checksum
    if: inputs.mode == 'production'
    runs-on: ubuntu-24.04
    needs: [npm-finalize, native-finalize]
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RELEASE_BUILD_WORKFLOW_SHA: ${{ job.workflow_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-native-*-${{ inputs.tag }}
          path: collected
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-npm-${{ inputs.tag }}
          path: collected/npm
      - name: Reject links and collect release assets
        shell: bash
        run: |
          if find collected -type l -print -quit | grep -q .; then exit 1; fi
          mkdir release
          find collected -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.whl' -o -name '*.tgz' -o -name 'guardscan-*.spdx.json' -o -name 'guardscan-*.cyclonedx.json' -o -name '*.sigstore.json' -o -name '*.notarization.json' -o -name '*.txt' \) -exec cp {} release/ \;
      - name: Build production manifest with trusted default-branch tooling
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const cp = require('child_process');
          const {compareUtf8} = require('./cli/scripts/release/deterministic');
          const {releaseToolchainVersions} = require('./cli/scripts/release/standalone');
          const files = [];
          const walk = dir => fs.readdirSync(dir, {withFileTypes: true}).forEach(entry => { const file = path.join(dir, entry.name); if (entry.isDirectory()) walk(file); else if (entry.name.endsWith('.metadata.json')) files.push(path.relative('collected', file)); });
          walk('collected');
          files.sort(compareUtf8);
          const createdAt = new Date(cp.execFileSync(
            'git', ['-C', 'source', 'show', '-s', '--format=%cI', 'HEAD'], {encoding: 'utf8'}
          ).trim()).toISOString();
          const tools = Object.entries(releaseToolchainVersions())
            .map(([name, version]) => ({name, version}))
            .sort((left, right) => compareUtf8(left.name, right.name));
          const descriptor = {
            schemaVersion: 'guardscan.release-manifest-input.v1',
            profile: 'full',
            createdAt,
            producer: {
              provider: 'github-actions',
              repository: process.env.GITHUB_REPOSITORY,
              workflow: '.github/workflows/release-build.yml',
              workflowSha: process.env.RELEASE_BUILD_WORKFLOW_SHA,
              runId: process.env.GITHUB_RUN_ID,
              runAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              sourceRef: `refs/tags/${process.env.RELEASE_TAG}`,
            },
            toolchain: {
              node: process.versions.node,
              packageManager: {
                name: 'npm',
                version: cp.execFileSync('npm', ['--version'], {encoding: 'utf8'}).trim(),
              },
              tools,
            },
            artifactFiles: files,
          };
          fs.writeFileSync('collected/release-manifest-input.json', `${JSON.stringify(descriptor, null, 2)}\n`);
          NODE
          node cli/scripts/release/index.js manifest --descriptor collected/release-manifest-input.json --output release/release-manifest.json --package-root "$GITHUB_WORKSPACE/source/cli" --repository-root "$GITHUB_WORKSPACE/source" --schema-root "$GITHUB_WORKSPACE/cli"
      - name: Produce and sign aggregate checksums
        shell: bash
        run: |
          [[ "$RELEASE_BUILD_WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          printf '%s\n' "{\"schemaVersion\":\"guardscan.release-build-provenance.v1\",\"workflow\":\".github/workflows/release-build.yml\",\"ref\":\"refs/heads/main\",\"sha\":\"$RELEASE_BUILD_WORKFLOW_SHA\"}" > release/release-build-provenance.json
          HASH_CMD=(sha256sum); command -v sha256sum >/dev/null 2>&1 || HASH_CMD=(shasum -a 256)
          find release -type f ! -name 'SHA256SUMS*' -print0 | sort -z | xargs -0 "${HASH_CMD[@]}" | sed 's#  release/#  #' > release/SHA256SUMS
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Keyless-sign aggregate checksums
        run: |
          cosign sign-blob --yes --bundle release/SHA256SUMS.sigstore.json release/SHA256SUMS
          cosign verify-blob --bundle release/SHA256SUMS.sigstore.json --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@refs/heads/main" --certificate-github-workflow-ref "refs/heads/main" --certificate-github-workflow-sha "$RELEASE_BUILD_WORKFLOW_SHA" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" release/SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/release-manifest.json
            release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 30

  provider-build:
    name: Unprivileged provider rehearsal build ${{ matrix.id }}
    if: inputs.mode == 'rehearsal'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: darwin-arm64, runner: macos-15, os: darwin, arch: arm64, executable: guardscan}
          - {id: windows-x64, runner: windows-2025, os: windows, arch: x64, executable: guardscan.exe}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - working-directory: cli
        run: npm run build
      - working-directory: cli
        run: npm run release:build -- --kind standalone --output-dir ../rehearsal-standalone
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-rehearsal-input-${{ matrix.id }}
          path: rehearsal-standalone/
          if-no-files-found: error
          retention-days: 14

  provider-finalize:
    name: Provider rehearsal signing ${{ matrix.id }}
    if: inputs.mode == 'rehearsal'
    runs-on: ${{ matrix.runner }}
    needs: [provider-build]
    environment: ${{ matrix.os == 'darwin' && 'apple-notarization' || 'windows-signing' }}
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_BUILD_WORKFLOW_SHA: ${{ job.workflow_sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {id: darwin-arm64, runner: macos-15, os: darwin, arch: arm64, executable: guardscan}
          - {id: windows-x64, runner: windows-2025, os: windows, arch: x64, executable: guardscan.exe}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci --ignore-scripts
      - id: download-provider-input
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: provider-rehearsal-input-${{ matrix.id }}
          path: rehearsal-standalone
      - name: Require artifact-service digest for provider input
        env:
          ARTIFACT_DIGEST: ${{ steps.download-provider-input.outputs.artifact-digest }}
        run: test -n "$ARTIFACT_DIGEST"
      - name: Import Apple rehearsal certificate
        if: matrix.os == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/guardscan-rehearsal.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE_P12" | openssl base64 -d -A > "$RUNNER_TEMP/rehearsal-certificate.p12"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security import "$RUNNER_TEMP/rehearsal-certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
      - name: Sign and notarize Apple rehearsal executable
        if: matrix.os == 'darwin'
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/guardscan-rehearsal.keychain-db"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -v team="($APPLE_TEAM_ID)" 'index($0, "Developer ID Application:") && index($0, team) {print $2}')"
          test -n "$IDENTITY"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" rehearsal-standalone/guardscan
          codesign --verify --deep --strict rehearsal-standalone/guardscan
          printf '%s' "$APPLE_NOTARY_PRIVATE_KEY" > "$RUNNER_TEMP/rehearsal-AuthKey.p8"
          hdiutil create -volname 'GuardScan rehearsal' -srcfolder rehearsal-standalone -format UDZO "$RUNNER_TEMP/rehearsal.dmg"
          xcrun notarytool submit "$RUNNER_TEMP/rehearsal.dmg" --key "$RUNNER_TEMP/rehearsal-AuthKey.p8" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --output-format json > rehearsal-standalone/notary-submission.json
          test "$(node -p 'require(process.argv[1]).status' rehearsal-standalone/notary-submission.json)" = Accepted
          codesign -dvvv rehearsal-standalone/guardscan 2> rehearsal-standalone/apple-code-signing.txt
      - name: Azure OIDC login for Windows rehearsal
        if: matrix.os == 'windows'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Authenticode-sign Windows rehearsal executable
        if: matrix.os == 'windows'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\rehearsal-standalone\guardscan.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          cache-dependencies: false
      - name: Verify rehearsal Authenticode signature and timestamp
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $file = 'rehearsal-standalone\guardscan.exe'
          $signature = Get-AuthenticodeSignature $file
          if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode status: $($signature.Status)" }
          if ($null -eq $signature.TimeStamperCertificate) { throw 'Authenticode timestamp is missing' }
          [ordered]@{
            status = [string]$signature.Status
            artifactSha256 = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            signerThumbprint = $signature.SignerCertificate.Thumbprint.ToLowerInvariant()
            timestampThumbprint = $signature.TimeStamperCertificate.Thumbprint.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -Encoding utf8 rehearsal-standalone\authenticode-verification.json
      - name: Write non-production provider rehearsal evidence
        env:
          REHEARSAL_REF: ${{ inputs.ref }}
          REHEARSAL_MODE: ${{ inputs.mode }}
          REHEARSAL_PLATFORM: ${{ matrix.id }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const prototype = JSON.parse(fs.readFileSync('rehearsal-standalone/standalone-prototype.json'));
          const sourceCommit = cp.execFileSync('git', ['-C', 'source', 'rev-parse', 'HEAD'], {encoding: 'utf8'}).trim();
          if (prototype.productionReady !== false || sourceCommit !== process.env.REHEARSAL_REF || prototype.commit !== process.env.REHEARSAL_REF) throw new Error('provider rehearsal source binding failed');
          let azureAuthenticodeSigning = false;
          if (process.env.REHEARSAL_PLATFORM.startsWith('windows')) {
            azureAuthenticodeSigning = JSON.parse(fs.readFileSync('rehearsal-standalone/authenticode-verification.json'));
            if (azureAuthenticodeSigning.status !== 'Valid'
                || !/^[a-f0-9]{64}$/.test(azureAuthenticodeSigning.artifactSha256 || '')
                || !/^[a-f0-9]{40}$/.test(azureAuthenticodeSigning.signerThumbprint || '')
                || !/^[a-f0-9]{40}$/.test(azureAuthenticodeSigning.timestampThumbprint || '')) {
              throw new Error('Windows rehearsal Authenticode evidence is incomplete');
            }
          }
          fs.writeFileSync('rehearsal-standalone/provider-rehearsal-evidence.json', `${JSON.stringify({schemaVersion: 'guardscan.provider-rehearsal.v1', productionReady: false, source: {repository: process.env.GITHUB_REPOSITORY, commit: sourceCommit, ref: process.env.REHEARSAL_REF}, workflow: {runId: process.env.GITHUB_RUN_ID, mode: process.env.REHEARSAL_MODE}, platform: process.env.REHEARSAL_PLATFORM, checks: {standaloneBuild: true, appleSigningAndNotarization: process.env.REHEARSAL_PLATFORM.startsWith('darwin'), azureAuthenticodeSigning}, publication: {tag: false, release: false, package: false, catalog: false, ledger: false}}, null, 2)}\n`);
          NODE
          rm -f rehearsal-standalone/guardscan rehearsal-standalone/guardscan.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-rehearsal-${{ matrix.id }}
          path: rehearsal-standalone/
          if-no-files-found: error
          retention-days: 14
