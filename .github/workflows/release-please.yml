name: Prepare Release Pull Request

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  manual-guard:
    name: Refuse manual release-please dispatch while disabled
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Require explicit Release Please enablement
        env:
          RELEASE_PLEASE_ENABLED: ${{ vars.RELEASE_PLEASE_ENABLED }}
        run: |
          test "$RELEASE_PLEASE_ENABLED" = true || {
            echo 'Release Please automation is disabled; manual dispatch refused.' >&2
            exit 1
          }

  release-pr:
    name: Update release pull request
    if: ${{ vars.RELEASE_PLEASE_ENABLED == 'true' && vars.RELEASE_APP_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create short-lived release app token
        id: release-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-metadata: read

      - name: Prepare or update release pull request only
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true
