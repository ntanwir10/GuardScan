name: Release credential and provider health

on:
  workflow_call:
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: false
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_NOTARY_KEY_ID:
        required: false
      APPLE_NOTARY_ISSUER_ID:
        required: false
      APPLE_NOTARY_PRIVATE_KEY:
        required: false
      AZURE_CLIENT_ID:
        required: false
      AZURE_TENANT_ID:
        required: false
      AZURE_SUBSCRIPTION_ID:
        required: false
      AZURE_FEDERATED_RESOURCE_GROUP:
        required: false
      WINGET_CREATE_GITHUB_TOKEN:
        required: false
      CHOCO_API_KEY:
        required: false
    outputs:
      status:
        description: Aggregate provider health status
        value: ${{ jobs.report.outputs.status }}
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: release-credential-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  github-catalog:
    name: GitHub App and shared catalog connectivity
    if: >-
      vars.RELEASE_CREDENTIAL_MONITOR_ENABLED == 'true'
      || vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Mint least-privilege cross-repository installation token
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ntanwir10
          repositories: GuardScan,homebrew-tap
          permission-contents: read
          permission-metadata: read
      - name: Record GitHub App and catalog health
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TOKEN_STEP_OUTCOME: ${{ steps.app.outcome }}
        run: |
          node - <<'NODE'
          const cp = require('child_process');
          const fs = require('fs');
          const evidence = {
            schemaVersion: 'guardscan.credential-health.v1',
            provider: 'github-app-catalog',
            status: 'healthy',
            checkedAt: new Date().toISOString(),
            checks: {},
            expiry: {status: 'unknown', reason: 'GitHub does not expose private-key age or expiry to an installation token'},
          };
          let stage = 'token_mint';
          try {
            if (process.env.TOKEN_STEP_OUTCOME !== 'success' || !process.env.GH_TOKEN) {
              throw new Error('token_mint_failed');
            }
            evidence.checks.tokenMint = {status: 'healthy'};
            const api = (endpoint, jq) => cp.execFileSync(
              'gh',
              ['api', endpoint, ...(jq ? ['--jq', jq] : [])],
              {encoding: 'utf8', env: process.env, stdio: ['ignore', 'pipe', 'pipe']}
            ).trim();
            const apiRaw = endpoint => cp.execFileSync(
              'gh',
              ['api', '-H', 'Accept: application/vnd.github.raw+json', endpoint],
              {encoding: 'utf8', env: process.env, stdio: ['ignore', 'pipe', 'pipe']}
            );
            stage = 'guardscan_connectivity';
            if (api('repos/ntanwir10/GuardScan', '.full_name') !== 'ntanwir10/GuardScan') {
              throw new Error('guardscan_identity_mismatch');
            }
            stage = 'catalog_connectivity';
            if (api('repos/ntanwir10/homebrew-tap', '.full_name') !== 'ntanwir10/homebrew-tap') {
              throw new Error('catalog_identity_mismatch');
            }
            stage = 'workflow_connectivity';
            const trainWorkflow = apiRaw(
              'repos/ntanwir10/GuardScan/contents/.github/workflows/release-train.yml'
            );
            const catalogWorkflow = apiRaw(
              'repos/ntanwir10/homebrew-tap/contents/.github/workflows/verify.yml'
            );
            if (!trainWorkflow.includes('*/30 * * * *')
                || !trainWorkflow.includes('catalog_updated')
                || !catalogWorkflow.includes('channel-lock.json')) {
              throw new Error('workflow_contract_invalid');
            }
            evidence.checks.repositories = {
              status: 'healthy',
              repositories: ['ntanwir10/GuardScan', 'ntanwir10/homebrew-tap'],
            };
            evidence.checks.requestedPermissions = {
              status: 'healthy',
              note: 'monitor token is repository-scoped and requests read-only permissions',
            };
            evidence.checks.catalogWorkflow = {status: 'healthy'};
            evidence.checks.scheduledReconciliation = {status: 'healthy'};
            evidence.checks.exactInstallationSet = {
              status: 'unknown',
              reason: 'least-privilege repository-scoped token cannot enumerate unrelated App installations',
            };
            evidence.checks.catalogBranchProtection = {
              status: 'unknown',
              reason: 'required-check metadata needs administration read permission not granted to the release App',
            };
            evidence.checks.dispatchPermission = {
              status: 'unknown',
              reason: 'non-publishing monitor does not emit a test dispatch',
            };
          } catch {
            evidence.status = 'unhealthy';
            evidence.checks.failure = {status: 'unhealthy', code: `${stage}_failed`};
          }
          fs.writeFileSync('github-app-catalog-health.json', `${JSON.stringify(evidence, null, 2)}\n`, {mode: 0o600});
          if (evidence.status === 'unhealthy') process.exitCode = 1;
          NODE
      - name: Upload sanitized GitHub health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-health-github-app
          path: github-app-catalog-health.json
          if-no-files-found: error
          retention-days: 30

  trusted-publishers:
    name: npm and Python trusted-publisher observability
    if: >-
      vars.RELEASE_CREDENTIAL_MONITOR_ENABLED == 'true'
      || vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record provider visibility boundaries
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const reason = 'trusted-publisher bindings are not exposed to this non-publishing workflow identity';
          const evidence = {
            schemaVersion: 'guardscan.credential-health.v1',
            provider: 'trusted-publishers',
            status: 'unknown',
            checkedAt: new Date().toISOString(),
            checks: {
              npm: {status: 'unknown', reason, requiredRehearsal: 'candidate preflight'},
              testpypi: {status: 'unknown', reason, requiredRehearsal: 'TestPyPI publish and lifecycle canary'},
              pypi: {status: 'unknown', reason, requiredRehearsal: 'exact release-train OIDC subject'},
            },
            expiry: {status: 'unknown', reason: 'OIDC trusted publishers have no stored release token expiry'},
          };
          fs.writeFileSync('trusted-publishers-health.json', `${JSON.stringify(evidence, null, 2)}\n`, {mode: 0o600});
          NODE
      - name: Upload sanitized trusted-publisher evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-health-trusted-publishers
          path: trusted-publishers-health.json
          if-no-files-found: error
          retention-days: 30

  apple:
    name: Apple certificate expiry and notary authentication
    if: >-
      vars.RELEASE_CREDENTIAL_MONITOR_ENABLED == 'true'
      || vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    environment: apple-notarization
    steps:
      - name: Check certificate and perform read-only notary authentication
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_PRIVATE_KEY: ${{ secrets.APPLE_NOTARY_PRIVATE_KEY }}
        run: |
          node - <<'NODE'
          const cp = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const temp = path.join(process.env.RUNNER_TEMP, 'guardscan-credential-monitor');
          const evidence = {
            schemaVersion: 'guardscan.credential-health.v1',
            provider: 'apple-signing-notary',
            status: 'unhealthy',
            checkedAt: new Date().toISOString(),
            checks: {},
            renewal: {status: 'external-authority-required'},
          };
          let stage = 'configuration';
          const run = (command, args) => {
            const result = cp.spawnSync(command, args, {
              encoding: 'utf8', env: process.env, stdio: ['ignore', 'pipe', 'pipe'],
            });
            if (result.status !== 0 || result.error) throw new Error(`${stage}_failed`);
            return result.stdout.trim();
          };
          try {
            const required = [
              'APPLE_CERTIFICATE_P12', 'APPLE_CERTIFICATE_PASSWORD', 'APPLE_TEAM_ID',
              'APPLE_NOTARY_KEY_ID', 'APPLE_NOTARY_ISSUER_ID', 'APPLE_NOTARY_PRIVATE_KEY',
            ];
            if (required.some(name => !process.env[name])) throw new Error('configuration_missing');
            fs.mkdirSync(temp, {recursive: true, mode: 0o700});
            const p12 = path.join(temp, 'certificate.p12');
            const pem = path.join(temp, 'certificate.pem');
            const notaryKey = path.join(temp, 'AuthKey.p8');
            fs.writeFileSync(p12, Buffer.from(process.env.APPLE_CERTIFICATE_P12, 'base64'), {mode: 0o600});
            fs.writeFileSync(notaryKey, process.env.APPLE_NOTARY_PRIVATE_KEY, {mode: 0o600});
            stage = 'certificate_decode';
            run('openssl', [
              'pkcs12', '-in', p12, '-clcerts', '-nokeys',
              '-passin', 'env:APPLE_CERTIFICATE_PASSWORD', '-out', pem,
            ]);
            stage = 'certificate_identity';
            const subject = run('openssl', ['x509', '-in', pem, '-noout', '-subject', '-nameopt', 'RFC2253']);
            const teamMatched = subject.includes(process.env.APPLE_TEAM_ID);
            if (!teamMatched) throw new Error('certificate_team_mismatch');
            const notAfter = run('openssl', ['x509', '-in', pem, '-noout', '-enddate']).replace(/^notAfter=/, '');
            const expiryMs = Date.parse(notAfter);
            if (!Number.isFinite(expiryMs)) throw new Error('certificate_expiry_invalid');
            const daysRemaining = Math.floor((expiryMs - Date.now()) / 86400000);
            const alertThresholds = [60, 30, 14, 7];
            evidence.checks.certificate = {
              status: daysRemaining <= 0 ? 'unhealthy' : daysRemaining <= 60 ? 'warning' : 'healthy',
              teamMatched,
              expiresAt: new Date(expiryMs).toISOString(),
              daysRemaining,
              alertThresholdDays: alertThresholds,
              crossedAlertThresholdDays: alertThresholds.filter(days => daysRemaining <= days),
            };
            stage = 'notary_authentication';
            const history = run('xcrun', [
              'notarytool', 'history', '--key', notaryKey,
              '--key-id', process.env.APPLE_NOTARY_KEY_ID,
              '--issuer', process.env.APPLE_NOTARY_ISSUER_ID,
              '--output-format', 'json',
            ]);
            JSON.parse(history);
            evidence.checks.notaryAuthentication = {status: 'healthy', operation: 'history-read'};
            evidence.status = daysRemaining <= 7 ? 'unhealthy' : daysRemaining <= 60 ? 'warning' : 'healthy';
            if (evidence.status === 'warning') {
              console.error(`::warning::Apple signing certificate expires in ${daysRemaining} days`);
            }
          } catch (error) {
            evidence.status = 'unhealthy';
            evidence.checks.failure = {
              status: 'unhealthy',
              code: error instanceof Error && /^[a-z0-9_]+$/.test(error.message)
                ? error.message : `${stage}_failed`,
            };
          } finally {
            fs.rmSync(temp, {recursive: true, force: true});
          }
          fs.writeFileSync('apple-health.json', `${JSON.stringify(evidence, null, 2)}\n`, {mode: 0o600});
          if (evidence.status === 'unhealthy') process.exitCode = 1;
          NODE
      - name: Upload sanitized Apple health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-health-apple
          path: apple-health.json
          if-no-files-found: error
          retention-days: 30

  azure:
    name: Azure OIDC and signing endpoint health
    if: >-
      vars.RELEASE_CREDENTIAL_MONITOR_ENABLED == 'true'
      || vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exchange GitHub OIDC identity with Azure
        id: azure-login
        continue-on-error: true
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Record Azure identity and non-signing preflight
        env:
          AZURE_LOGIN_OUTCOME: ${{ steps.azure-login.outcome }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
        run: |
          node - <<'NODE'
          const cp = require('child_process');
          const fs = require('fs');
          const evidence = {
            schemaVersion: 'guardscan.credential-health.v1',
            provider: 'azure-artifact-signing',
            status: 'unknown',
            checkedAt: new Date().toISOString(),
            checks: {},
            expiry: {status: 'unknown', reason: 'Azure OIDC federation has no stored client-secret expiry'},
          };
          let stage = 'oidc_login';
          try {
            const required = [
              'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'AZURE_CLIENT_ID',
              'AZURE_SIGNING_ACCOUNT', 'AZURE_SIGNING_PROFILE', 'AZURE_SIGNING_ENDPOINT',
            ];
            if (required.some(name => !process.env[name])) throw new Error('configuration_missing');
            if (process.env.AZURE_LOGIN_OUTCOME !== 'success') throw new Error('oidc_login_failed');
            const accountResult = cp.spawnSync('az', ['account', 'show', '--output', 'json'], {
              encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'],
            });
            if (accountResult.status !== 0 || accountResult.error) throw new Error('account_identity_failed');
            const account = JSON.parse(accountResult.stdout);
            if (String(account.tenantId).toLowerCase() !== process.env.AZURE_TENANT_ID.toLowerCase()
                || String(account.id).toLowerCase() !== process.env.AZURE_SUBSCRIPTION_ID.toLowerCase()) {
              throw new Error('account_identity_mismatch');
            }
            evidence.checks.oidc = {status: 'healthy'};
            evidence.checks.accountIdentity = {status: 'healthy', tenantMatched: true, subscriptionMatched: true};
            stage = 'signing_endpoint';
            const endpoint = new URL(process.env.AZURE_SIGNING_ENDPOINT);
            if (endpoint.protocol !== 'https:' || endpoint.username || endpoint.password) {
              throw new Error('signing_endpoint_invalid');
            }
            const endpointResult = cp.spawnSync('curl', [
              '--silent', '--show-error', '--output', '/dev/null', '--head',
              '--max-time', '15', endpoint.toString(),
            ], {stdio: ['ignore', 'ignore', 'pipe']});
            if (endpointResult.status !== 0 || endpointResult.error) throw new Error('signing_endpoint_unreachable');
            evidence.checks.endpointConnectivity = {status: 'healthy'};
            evidence.checks.signingProfile = {status: 'unknown', reason: 'configured profile cannot be queried without a management resource identifier and signer-role inspection'};
            evidence.checks.federatedSubject = {status: 'unknown', reason: 'Azure does not expose federated-subject metadata through the configured data-plane coordinates'};
            evidence.checks.signerRole = {status: 'unknown', reason: 'role assignment is not safely inferable from OIDC login alone'};
          } catch (error) {
            evidence.status = 'unhealthy';
            evidence.checks.failure = {
              status: 'unhealthy',
              code: error instanceof Error && /^[a-z0-9_]+$/.test(error.message)
                ? error.message : `${stage}_failed`,
            };
          }
          fs.writeFileSync('azure-health.json', `${JSON.stringify(evidence, null, 2)}\n`, {mode: 0o600});
          if (evidence.status === 'unhealthy') process.exitCode = 1;
          NODE
      - name: Upload sanitized Azure health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-health-azure
          path: azure-health.json
          if-no-files-found: error
          retention-days: 30

  winget:
    name: WinGet submitter token identity and expiry metadata
    if: >-
      vars.RELEASE_CREDENTIAL_MONITOR_ENABLED == 'true'
      || vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: winget
    steps:
      - name: Run read-only WinGet submitter authentication preflight
        env:
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          node - <<'NODE'
          const cp = require('child_process');
          const fs = require('fs');
          const evidence = {
            schemaVersion: 'guardscan.credential-health.v1',
            provider: 'winget-submitter',
            status: 'unknown',
            checkedAt: new Date().toISOString(),
            checks: {
              claStatus: {status: 'unknown', reason: 'Microsoft CLA state is not exposed by a non-submitting GitHub API request'},
              submissionPermission: {status: 'unknown', reason: 'write capability is intentionally not exercised by this monitor'},
            },
            expiry: {status: 'unknown', reason: 'GitHub did not expose token-expiration metadata'},
          };
          let stage = 'configuration';
          const run = args => {
            const result = cp.spawnSync('gh', args, {
              encoding: 'utf8', env: process.env, stdio: ['ignore', 'pipe', 'pipe'],
            });
            if (result.status !== 0 || result.error) throw new Error(`${stage}_failed`);
            return result.stdout;
          };
          try {
            if (!process.env.GH_TOKEN) throw new Error('configuration_missing');
            stage = 'token_identity';
            const response = run(['api', '--include', 'user']);
            const bodyIndex = response.indexOf('{');
            if (bodyIndex < 0) throw new Error('token_identity_invalid');
            const headers = response.slice(0, bodyIndex);
            const user = JSON.parse(response.slice(bodyIndex));
            if (user.login !== 'ntanwir10') throw new Error('token_identity_mismatch');
            evidence.checks.tokenIdentity = {status: 'healthy', login: user.login};
            stage = 'package_repository_connectivity';
            const repository = JSON.parse(run(['api', 'repos/microsoft/winget-pkgs']));
            if (repository.full_name !== 'microsoft/winget-pkgs') throw new Error('repository_identity_mismatch');
            evidence.checks.packageRepository = {status: 'healthy'};
            const expiryHeader = /^github-authentication-token-expiration:\s*(.+)$/im.exec(headers);
            const scopesHeader = /^x-oauth-scopes:\s*(.*)$/im.exec(headers);
            evidence.checks.scopeMetadata = scopesHeader && scopesHeader[1].trim()
              ? {status: 'observed', scopes: scopesHeader[1].split(',').map(value => value.trim()).filter(Boolean)}
              : {status: 'unknown', reason: 'GitHub did not expose token-scope metadata for this token type'};
            if (expiryHeader) {
              const expiryMs = Date.parse(expiryHeader[1].trim());
              if (Number.isFinite(expiryMs)) {
                const daysRemaining = Math.floor((expiryMs - Date.now()) / 86400000);
                evidence.expiry = {
                  status: 'known',
                  expiresAt: new Date(expiryMs).toISOString(),
                  daysRemaining,
                  alertThresholdDays: [30, 14, 7],
                };
                if (daysRemaining <= 0) evidence.status = 'unhealthy';
                else if (daysRemaining <= 30) evidence.status = 'warning';
              }
            }
          } catch (error) {
            evidence.status = 'unhealthy';
            evidence.checks.failure = {
              status: 'unhealthy',
              code: error instanceof Error && /^[a-z0-9_]+$/.test(error.message)
                ? error.message : `${stage}_failed`,
            };
          }
          fs.writeFileSync('winget-health.json', `${JSON.stringify(evidence, null, 2)}\n`, {mode: 0o600});
          if (evidence.status === 'warning') console.error('::warning::WinGet submitter token is within its expiry alert window');
          if (evidence.status === 'unhealthy') process.exitCode = 1;
          NODE
      - name: Upload sanitized WinGet health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-health-winget
          path: winget-health.json
          if-no-files-found: error
          retention-days: 30

  chocolatey:
    name: Chocolatey non-publishing provider visibility
    if: >-
      vars.RELEASE_CREDENTIAL_MONITOR_ENABLED == 'true'
      || vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: chocolatey
    steps:
      - name: Check configuration and public repository connectivity
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          node - <<'NODE'
          const cp = require('child_process');
          const fs = require('fs');
          const evidence = {
            schemaVersion: 'guardscan.credential-health.v1',
            provider: 'chocolatey-publisher',
            status: 'unknown',
            checkedAt: new Date().toISOString(),
            checks: {
              apiKeyAuthentication: {status: 'unknown', reason: 'Chocolatey exposes no documented non-publishing API-key authentication check'},
              accountOwnership: {status: 'unknown', reason: 'publisher ownership is not exposed by the public package feed'},
            },
            expiry: {status: 'unknown', reason: 'Chocolatey does not expose API-key expiry metadata'},
          };
          try {
            if (!process.env.CHOCO_API_KEY) throw new Error('configuration_missing');
            evidence.checks.apiKeyConfigured = {status: 'healthy'};
            const result = cp.spawnSync('curl', [
              '--fail', '--silent', '--show-error', '--output', '/dev/null',
              '--max-time', '15', 'https://community.chocolatey.org/api/v2/',
            ], {stdio: ['ignore', 'ignore', 'pipe']});
            if (result.status !== 0 || result.error) throw new Error('public_repository_unreachable');
            evidence.checks.publicRepository = {status: 'healthy'};
          } catch (error) {
            evidence.status = 'unhealthy';
            evidence.checks.failure = {
              status: 'unhealthy',
              code: error instanceof Error && /^[a-z0-9_]+$/.test(error.message)
                ? error.message : 'provider_check_failed',
            };
          }
          fs.writeFileSync('chocolatey-health.json', `${JSON.stringify(evidence, null, 2)}\n`, {mode: 0o600});
          if (evidence.status === 'unhealthy') process.exitCode = 1;
          NODE
      - name: Upload sanitized Chocolatey health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: credential-health-chocolatey
          path: chocolatey-health.json
          if-no-files-found: error
          retention-days: 30

  report:
    name: Aggregate sanitized provider health
    if: >-
      always()
      && (vars.RELEASE_CREDENTIAL_MONITOR_ENABLED == 'true'
      || vars.RELEASE_AUTOMATION_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [github-catalog, trusted-publishers, apple, azure, winget, chocolatey]
    outputs:
      status: ${{ steps.health-report.outputs.status }}
    steps:
      - name: Download provider evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: credential-health-*
          path: credential-health-evidence
          merge-multiple: true
      - name: Build machine-readable health report
        id: health-report
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'credential-health-evidence';
          const providers = fs.readdirSync(root)
            .filter(name => name.endsWith('.json'))
            .map(name => JSON.parse(fs.readFileSync(path.join(root, name), 'utf8')))
            .sort((left, right) => left.provider.localeCompare(right.provider));
          const expected = [
            'apple-signing-notary', 'azure-artifact-signing', 'chocolatey-publisher',
            'github-app-catalog', 'trusted-publishers', 'winget-submitter',
          ];
          if (providers.length !== expected.length
              || providers.some((item, index) => (
                item.schemaVersion !== 'guardscan.credential-health.v1'
                || item.provider !== expected[index]
                || !['healthy', 'warning', 'unknown', 'unhealthy'].includes(item.status)
              ))) {
            throw new Error('provider health evidence is missing, duplicated, or malformed');
          }
          const statuses = new Set(providers.map(item => item.status));
          const status = statuses.has('unhealthy') ? 'unhealthy'
            : statuses.has('warning') ? 'warning'
              : statuses.has('unknown') ? 'unknown' : 'healthy';
          const report = {
            schemaVersion: 'guardscan.credential-health-report.v1',
            status,
            checkedAt: new Date().toISOString(),
            providers,
          };
          fs.writeFileSync('credential-health-report.json', `${JSON.stringify(report, null, 2)}\n`, {mode: 0o600});
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `status=${status}\n`);
          const summary = [
            '## Release credential and provider health',
            '',
            `Overall: **${status}**`,
            '',
            '| Provider | Status |',
            '| --- | --- |',
            ...providers.map(item => `| ${item.provider} | ${item.status} |`),
            '',
            'Unknown means the provider does not safely expose that state to this non-publishing workflow.',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${summary.join('\n')}\n`);
          NODE
      - name: Upload aggregate credential health report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-credential-health-report
          path: credential-health-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Fail closed on unknown or unhealthy provider checks
        run: |
          node -e "const report=require('./credential-health-report.json'); if(report.status!=='healthy') process.exit(1)"
