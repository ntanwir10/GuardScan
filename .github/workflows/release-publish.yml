name: Reusable multi-channel publication

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read

env:
  RELEASE_NODE_VERSION: 22.23.1
  RELEASE_NPM_VERSION: 11.5.2
  RELEASE_WINGETCREATE_VERSION: 1.12.13.0
  RELEASE_WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea

jobs:
  github:
    name: Immutable GitHub release
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel == 'rc' && 'release-rc' || 'release-stable' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Create or reuse draft and upload only missing identical assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            PRERELEASE=()
            if [ "${{ inputs.channel }}" = rc ]; then PRERELEASE+=(--prerelease); fi
            gh release create "${{ inputs.tag }}" \
              --repo "${{ github.repository }}" \
              --verify-tag --draft "${PRERELEASE[@]}" \
              --title "GuardScan ${{ inputs.tag }}" \
              --generate-notes
          fi
          IS_DRAFT="$(gh release view "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" --json isDraft --jq .isDraft)"
          while IFS= read -r -d '' FILE; do
            NAME="$(basename "$FILE")"
            ASSET_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ inputs.tag }}" \
              --jq ".assets[] | select(.name == \"$NAME\") | .id" | head -n 1)"
            if [ -n "$ASSET_ID" ]; then
              gh api \
                -H "Accept: application/octet-stream" \
                "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID" \
                > "$RUNNER_TEMP/$NAME"
              if ! cmp --silent "$FILE" "$RUNNER_TEMP/$NAME"; then
                echo "::error::Release-integrity incident: $NAME already exists with different bytes"
                exit 1
              fi
            else
              if [ "$IS_DRAFT" != true ]; then
                echo "::error::Published release is missing required immutable asset $NAME"
                exit 1
              fi
              gh release upload "${{ inputs.tag }}" "$FILE" --repo "${{ github.repository }}"
            fi
          done < <(find payload -maxdepth 1 -type f -print0 | sort -z)
      - name: Redownload and verify every draft asset before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir redownload
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --dir redownload
          diff -u <(find payload -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(find redownload -maxdepth 1 -type f -printf '%f\n' | sort)
          (cd redownload && sha256sum --check SHA256SUMS)
          cosign verify-blob \
            --bundle redownload/SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-train.yml@" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            redownload/SHA256SUMS
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "${{ inputs.tag }}" --repo "${{ github.repository }}" --draft=false
          fi

  npm:
    name: npm trusted publication
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    needs: [github]
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-npm-${{ inputs.tag }}
          path: npm-artifact
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install trusted-publishing-capable npm CLI
        run: |
          npm install --global "npm@${RELEASE_NPM_VERSION}"
          test "$(npm --version)" = "$RELEASE_NPM_VERSION"
      - working-directory: cli
        run: npm ci
      - name: Verify and classify registry state
        id: preflight
        working-directory: cli
        run: npm run release:npm-preflight -- --artifact-dir ../npm-artifact --github-output "$GITHUB_OUTPUT"
      - name: Publish exact tested tarball
        if: steps.preflight.outputs.publish-required == 'true'
        working-directory: cli
        run: |
          DIST_TAG=latest
          if [ "${{ inputs.channel }}" = rc ]; then DIST_TAG=next; fi
          npm publish "../npm-artifact/${{ steps.preflight.outputs.filename }}" \
            --access public --provenance --tag "$DIST_TAG"
      - name: Verify public registry integrity
        working-directory: cli
        run: npm run release:npm-preflight -- --artifact-dir ../npm-artifact

  pypi-test:
    name: TestPyPI trusted publication
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    needs: [github]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload
      - name: Select every tested platform wheel
        run: |
          mkdir dist
          cp payload/*.whl dist/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Reject conflicting TestPyPI files
        env:
          REGISTRY_JSON_BASE: https://test.pypi.org/pypi/guardscan-cli
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.request

          version = os.environ["RELEASE_VERSION"].removeprefix("v").replace("-rc.", "rc")
          url = f'{os.environ["REGISTRY_JSON_BASE"]}/{version}/json'
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  remote = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              remote = {"urls": []}
          remote_files = {item["filename"]: item["digests"]["sha256"] for item in remote["urls"]}
          local_files = {
              wheel.name: hashlib.sha256(wheel.read_bytes()).hexdigest()
              for wheel in pathlib.Path("dist").glob("*.whl")
          }
          unexpected = sorted(set(remote_files) - set(local_files))
          if unexpected:
              raise SystemExit(f"TestPyPI has unexpected files for this version: {unexpected}")
          for filename, digest in local_files.items():
              if filename in remote_files and remote_files[filename] != digest:
                  raise SystemExit(f"TestPyPI integrity conflict for {filename}")
          PY
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
          print-hash: true
      - name: Verify complete TestPyPI file set
        env:
          REGISTRY_JSON_BASE: https://test.pypi.org/pypi/guardscan-cli
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.error, urllib.request

          version = os.environ["RELEASE_VERSION"].removeprefix("v").replace("-rc.", "rc")
          url = f'{os.environ["REGISTRY_JSON_BASE"]}/{version}/json'
          local = {
              wheel.name: hashlib.sha256(wheel.read_bytes()).hexdigest()
              for wheel in pathlib.Path("dist").glob("*.whl")
          }
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      remote = {
                          item["filename"]: item["digests"]["sha256"]
                          for item in json.load(response)["urls"]
                      }
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  remote = {}
              if remote == local:
                  break
              if set(remote) - set(local):
                  raise SystemExit("TestPyPI returned unexpected files for this version")
              if any(local.get(name) != digest for name, digest in remote.items()):
                  raise SystemExit("TestPyPI returned a conflicting wheel digest")
              if attempt == 29:
                  raise SystemExit("TestPyPI did not converge to the complete tested wheel set")
              time.sleep(10)
          PY

  pypi-test-lifecycle:
    name: TestPyPI lifecycle on ${{ matrix.target.id }}
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    needs: [pypi-test]
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: linux-x64-glibc
            runner: ubuntu-24.04
          - id: linux-arm64-glibc
            runner: ubuntu-24.04-arm
          - id: darwin-arm64
            runner: macos-15
          - id: darwin-x64
            runner: macos-15-intel
          - id: windows-x64
            runner: windows-2025
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Test TestPyPI wheel through pip and pipx on ${{ matrix.target.id }}
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PYPI_VERSION="${VERSION/-rc./rc}"
          exercise_guardscan() {
            executable="$1"
            label="$2"
            project="$PWD/testpypi-$label"
            rm -rf "$project"
            mkdir -p "$project"
            printf '{"name":"guardscan-testpypi","version":"1.0.0","private":true}\n' \
              > "$project/package.json"
            printf 'module.exports = 42;\n' > "$project/index.js"
            (
              cd "$project"
              test "$("$executable" --version | tr -d '\r')" = "$VERSION"
              "$executable" --help > help.txt
              grep -q scan help.txt
              "$executable" --no-telemetry scan --offline --no-cve --skip-tests --skip-ai \
                --format json --output scan.json
              python - <<'PY'
          import json
          scan = json.load(open('scan.json', encoding='utf-8'))
          if (
              scan.get('schemaVersion') != 'guardscan.scan.v1'
              or scan.get('run', {}).get('executionMode') != 'static-analysis'
              or scan.get('run', {}).get('offline') is not True
          ):
              raise SystemExit('TestPyPI offline scan contract failed')
          PY
            )
          }

          python -m pip install --index-url https://test.pypi.org/simple/ \
            --no-deps "guardscan-cli==$PYPI_VERSION"
          exercise_guardscan guardscan pip
          python -m pip uninstall -y guardscan-cli

          python -m pip install pipx
          python -m pipx install --index-url https://test.pypi.org/simple/ \
            --pip-args=--no-deps "guardscan-cli==$PYPI_VERSION"
          PIPX_BIN_DIR="$(python -m pipx environment --value PIPX_BIN_DIR)"
          GUARDSCAN="$PIPX_BIN_DIR/guardscan"
          if [ -f "$GUARDSCAN.exe" ]; then GUARDSCAN="$GUARDSCAN.exe"; fi
          exercise_guardscan "$GUARDSCAN" pipx
          python -m pipx runpip guardscan-cli show guardscan-cli
          python -m pipx uninstall guardscan-cli

  pypi:
    name: PyPI trusted publication
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    needs: [pypi-test-lifecycle]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: dist
      - name: Keep only wheel distributions
        run: find dist -maxdepth 1 -type f ! -name '*.whl' -delete
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Reject conflicting PyPI files
        env:
          REGISTRY_JSON_BASE: https://pypi.org/pypi/guardscan-cli
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, urllib.error, urllib.request

          version = os.environ["RELEASE_VERSION"].removeprefix("v").replace("-rc.", "rc")
          url = f'{os.environ["REGISTRY_JSON_BASE"]}/{version}/json'
          try:
              with urllib.request.urlopen(url, timeout=30) as response:
                  remote = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              remote = {"urls": []}
          remote_files = {item["filename"]: item["digests"]["sha256"] for item in remote["urls"]}
          local_files = {
              wheel.name: hashlib.sha256(wheel.read_bytes()).hexdigest()
              for wheel in pathlib.Path("dist").glob("*.whl")
          }
          unexpected = sorted(set(remote_files) - set(local_files))
          if unexpected:
              raise SystemExit(f"PyPI has unexpected files for this version: {unexpected}")
          for filename, digest in local_files.items():
              if filename in remote_files and remote_files[filename] != digest:
                  raise SystemExit(f"PyPI integrity conflict for {filename}")
          PY
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist
          skip-existing: true
          print-hash: true
      - name: Verify complete PyPI file set
        env:
          REGISTRY_JSON_BASE: https://pypi.org/pypi/guardscan-cli
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, time, urllib.error, urllib.request

          version = os.environ["RELEASE_VERSION"].removeprefix("v").replace("-rc.", "rc")
          url = f'{os.environ["REGISTRY_JSON_BASE"]}/{version}/json'
          local = {
              wheel.name: hashlib.sha256(wheel.read_bytes()).hexdigest()
              for wheel in pathlib.Path("dist").glob("*.whl")
          }
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      remote = {
                          item["filename"]: item["digests"]["sha256"]
                          for item in json.load(response)["urls"]
                      }
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  remote = {}
              if remote == local:
                  break
              if set(remote) - set(local):
                  raise SystemExit("PyPI returned unexpected files for this version")
              if any(local.get(name) != digest for name, digest in remote.items()):
                  raise SystemExit("PyPI returned a conflicting wheel digest")
              if attempt == 29:
                  raise SystemExit("PyPI did not converge to the complete tested wheel set")
              time.sleep(10)
          PY

  catalog:
    name: Shared Homebrew and Scoop catalog projection
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    needs: [github]
    permissions:
      contents: read
    steps:
      - name: Create short-lived release app token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ntanwir10
          repositories: homebrew-tap
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - name: Render the cryptographically bound shared catalog projection
        working-directory: cli
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          MANIFEST_SHA256="$(sha256sum ../payload/release-manifest.json | cut -d ' ' -f 1)"
          node scripts/release/index.js catalog \
            --manifest ../payload/release-manifest.json \
            --output-dir ../catalog-output \
            --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/release-manifest.json" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --generator-repository "$GITHUB_REPOSITORY" \
            --generator-commit "$RELEASE_REF"
      - name: Validate complete generated catalog projection
        run: |
          test -f catalog-output/Formula/guardscan.rb
          test -f catalog-output/bucket/guardscan.json
          test -f catalog-output/channel-lock.json
          test -f catalog/homebrew-tap/.github/workflows/verify.yml
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const lock = JSON.parse(fs.readFileSync('catalog-output/channel-lock.json'));
          if (lock.schemaVersion !== 'guardscan.channel-catalog.v1') {
            throw new Error('unexpected channel catalog schema');
          }
          const expected = new Map([
            ['Formula/guardscan.rb', 'catalog-output/Formula/guardscan.rb'],
            ['bucket/guardscan.json', 'catalog-output/bucket/guardscan.json'],
          ]);
          for (const [target, source] of expected) {
            const digest = crypto.createHash('sha256').update(fs.readFileSync(source)).digest('hex');
            if (lock.files?.[target]?.sha256 !== digest) {
              throw new Error(`channel-lock digest mismatch for ${target}`);
            }
          }
          NODE
      - name: Push one deterministic catalog update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          CATALOG_REPOSITORY="ntanwir10/homebrew-tap"
          if [ "$RELEASE_CHANNEL" = rc ]; then
            BRANCH="channel-preview/$RELEASE_TAG"
          else
            BRANCH="guardscan/$RELEASE_TAG"
          fi
          gh repo clone "$CATALOG_REPOSITORY" catalog-checkout
          (
            cd catalog-checkout
            git config user.name guardscan-release-bot
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            projection_matches() {
              for SPEC in \
                "../catalog-output/Formula/guardscan.rb:Formula/guardscan.rb" \
                "../catalog-output/bucket/guardscan.json:bucket/guardscan.json" \
                "../catalog-output/channel-lock.json:channel-lock.json" \
                "../catalog/homebrew-tap/.github/workflows/verify.yml:.github/workflows/verify.yml"; do
                IFS=: read -r SOURCE TARGET <<< "$SPEC"
                if [ ! -f "$TARGET" ] || ! cmp --silent "$SOURCE" "$TARGET"; then
                  return 1
                fi
              done
            }
            MAIN_ALREADY_CURRENT=false
            if [ "$RELEASE_CHANNEL" = stable ] && projection_matches; then
              MAIN_ALREADY_CURRENT=true
              BRANCH=main
            elif [ "$RELEASE_CHANNEL" = stable ] && [ -f channel-lock.json ]; then
              EXISTING_TAG="$(node -p 'require("./channel-lock.json").source?.tag || ""')"
              if [ "$EXISTING_TAG" = "$RELEASE_TAG" ]; then
                echo "::error::Release-integrity incident: main has this release identity with different catalog bytes"
                exit 1
              fi
            fi
            if [ "$MAIN_ALREADY_CURRENT" = true ]; then
              PR_NUMBER=
              PR_STATE=MERGED
            elif git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              git switch --detach "origin/$BRANCH"
              if ! projection_matches; then
                echo "::error::Release-integrity incident: $CATALOG_REPOSITORY@$BRANCH differs"
                exit 1
              fi
            else
              git switch -c "$BRANCH"
              mkdir -p Formula bucket .github/workflows
              cp ../catalog-output/Formula/guardscan.rb Formula/guardscan.rb
              cp ../catalog-output/bucket/guardscan.json bucket/guardscan.json
              cp ../catalog-output/channel-lock.json channel-lock.json
              cp ../catalog/homebrew-tap/.github/workflows/verify.yml .github/workflows/verify.yml
              git add Formula/guardscan.rb bucket/guardscan.json channel-lock.json .github/workflows/verify.yml
              git commit -m "guardscan $RELEASE_TAG"
              git push origin "$BRANCH"
            fi
            CATALOG_COMMIT="$(git rev-parse HEAD)"
            if [ "$MAIN_ALREADY_CURRENT" = true ]; then
              PR_NUMBER="$(gh api \
                "repos/$CATALOG_REPOSITORY/commits/$CATALOG_COMMIT/pulls" \
                --jq '.[0].number')"
              if [ -z "$PR_NUMBER" ]; then
                PR_NUMBER="$(gh pr list --repo "$CATALOG_REPOSITORY" \
                  --search "\"GuardScan $RELEASE_TAG\" in:title" \
                  --state merged --limit 1 --json number --jq '.[0].number')"
              fi
              if [ -z "$PR_NUMBER" ]; then
                echo "::error::Current catalog bytes have no merged GuardScan projection PR"
                exit 1
              fi
              PR_STATE=MERGED
            else
              PR_NUMBER="$(gh pr list --repo "$CATALOG_REPOSITORY" \
                --head "$BRANCH" --state all --limit 1 --json number --jq '.[0].number')"
              if [ -z "$PR_NUMBER" ]; then
                PR_ARGS=(
                  --repo "$CATALOG_REPOSITORY"
                  --base main
                  --head "$BRANCH"
                  --title "GuardScan $RELEASE_TAG"
                  --body "Generated from GuardScan's immutable release manifest and bound by channel-lock.json."
                )
                if [ "$RELEASE_CHANNEL" = rc ]; then PR_ARGS+=(--draft); fi
                gh pr create "${PR_ARGS[@]}"
                PR_NUMBER="$(gh pr list --repo "$CATALOG_REPOSITORY" \
                  --head "$BRANCH" --state all --limit 1 --json number --jq '.[0].number')"
              fi
              PR_STATE="$(gh pr view --repo "$CATALOG_REPOSITORY" "$PR_NUMBER" --json state --jq .state)"
              if [ "$RELEASE_CHANNEL" = stable ] && [ "$PR_STATE" != MERGED ]; then
                gh pr merge --repo "$CATALOG_REPOSITORY" "$PR_NUMBER" --auto --squash
              fi
            fi
            export CATALOG_REPOSITORY BRANCH CATALOG_COMMIT PR_NUMBER PR_STATE
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const lock = fs.readFileSync('channel-lock.json');
          fs.writeFileSync('../catalog-result.json', `${JSON.stringify({
            schemaVersion: 'guardscan.catalog-publication.v1',
            repository: process.env.CATALOG_REPOSITORY,
            branch: process.env.BRANCH,
            commit: process.env.CATALOG_COMMIT,
            pullRequest: process.env.PR_NUMBER ? Number(process.env.PR_NUMBER) : null,
            state: process.env.PR_STATE,
            lockSha256: crypto.createHash('sha256').update(lock).digest('hex'),
          }, null, 2)}\n`);
          NODE
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-catalog-${{ inputs.tag }}
          path: |
            catalog-output/channel-lock.json
            catalog-result.json
          if-no-files-found: error
          retention-days: 30

  winget:
    name: WinGet submission
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true' && inputs.channel == 'stable'
    runs-on: windows-2025
    needs: [github]
    environment: winget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - working-directory: cli
        run: npm run release:render -- --manifest ../payload/release-manifest.json --output-dir ../adapters
      - name: Validate and install WinGet local manifest
        shell: pwsh
        run: |
          if ($null -eq (Get-Command winget -ErrorAction SilentlyContinue)) {
            throw 'WinGet is unavailable on the selected Windows runner'
          }
          $installer = Get-ChildItem adapters\winget -Filter '*.installer.yaml' -Recurse | Select-Object -First 1
          if ($null -eq $installer) { throw 'Rendered WinGet installer manifest is missing' }
          $manifestDirectory = $installer.Directory.FullName
          winget validate --manifest $manifestDirectory
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed' }
          winget install --manifest $manifestDirectory --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw 'WinGet local manifest installation failed' }
          $installedVersion = (& guardscan --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $installedVersion -ne '${{ inputs.tag }}'.TrimStart('v')) {
            throw 'WinGet local manifest invocation or version check failed'
          }
          winget uninstall --exact --id NaumanTanwir.GuardScan
          if ($LASTEXITCODE -ne 0) { throw 'WinGet local manifest uninstall failed' }
      - name: Preflight and submit WinGet manifests with exact evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $packageIdentity = "NaumanTanwir.GuardScan@$version"
          $manifestPath = "manifests/n/NaumanTanwir/GuardScan/$version"
          $installer = Get-ChildItem adapters\winget -Filter '*.installer.yaml' -Recurse | Select-Object -First 1
          if ($null -eq $installer) { throw 'Rendered WinGet installer manifest is missing' }
          $manifestDirectory = $installer.Directory.FullName
          $localFiles = [ordered]@{}
          Get-ChildItem $manifestDirectory -File -Filter '*.yaml' | Sort-Object Name | ForEach-Object {
            $localFiles[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if ($localFiles.Count -ne 3) { throw 'WinGet evidence requires exactly three rendered manifests' }
          $digestInput = ($localFiles.GetEnumerator() | ForEach-Object { "$($_.Key)`0$($_.Value)`n" }) -join ''
          [IO.File]::WriteAllText('winget-digest-input.txt', $digestInput, [Text.UTF8Encoding]::new($false))
          $manifestDigest = (Get-FileHash winget-digest-input.txt -Algorithm SHA256).Hash.ToLowerInvariant()

          function Write-WinGetEvidence($state, $remoteIdentity, $pullRequest, $commit, $publicBytesVerified) {
            [ordered]@{
              schemaVersion = 'guardscan.moderated-submission.v1'
              channel = 'winget'
              version = $version
              tag = $env:RELEASE_TAG
              state = $state
              packageIdentity = $packageIdentity
              remoteIdentity = $remoteIdentity
              remoteDigest = $manifestDigest
              files = $localFiles
              provider = [ordered]@{
                repository = 'microsoft/winget-pkgs'
                path = $manifestPath
                pullRequest = $pullRequest
                commit = $commit
                publicBytesVerified = $publicBytesVerified
                pendingStateQuery = 'digest-bound open pull request, then protected release ledger'
              }
              checkedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
            } | ConvertTo-Json -Depth 8 | Out-File winget-evidence.json -Encoding utf8
          }

          function Assert-WinGetRemoteFiles($remoteFiles) {
            $expectedNames = @($localFiles.Keys | Sort-Object)
            $actualNames = @($remoteFiles | ForEach-Object { Split-Path $_.filename -Leaf } | Sort-Object)
            if (Compare-Object $expectedNames $actualNames) {
              throw 'WinGet public manifest integrity conflict'
            }
            foreach ($remoteFile in $remoteFiles) {
              $name = Split-Path $remoteFile.filename -Leaf
              $destination = Join-Path $env:RUNNER_TEMP "winget-remote-$name"
              Invoke-WebRequest $remoteFile.raw_url -OutFile $destination
              $remoteDigest = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($remoteDigest -ne $localFiles[$name]) {
                throw 'WinGet public manifest integrity conflict'
              }
            }
          }

          function Find-WinGetPullRequest($submitter, $title) {
            $query = "repo:microsoft/winget-pkgs is:pr is:open author:$submitter in:title `"$title`""
            $search = gh api --method GET search/issues -f q="$query" -f per_page=20
            if ($LASTEXITCODE -ne 0) { throw 'Unable to query pending WinGet pull requests reliably' }
            $match = ($search | Out-String | ConvertFrom-Json).items |
              Where-Object { $_.title -eq $title } |
              Sort-Object updated_at -Descending |
              Select-Object -First 1
            if ($null -eq $match) { return $null }
            $pull = gh api "repos/microsoft/winget-pkgs/pulls/$($match.number)"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read pending WinGet pull request' }
            return ($pull | Out-String | ConvertFrom-Json)
          }

          function Assert-WinGetPullRequest($pullRequest) {
            $pullFiles = gh api "repos/microsoft/winget-pkgs/pulls/$($pullRequest.number)/files?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read pending WinGet pull request files' }
            $remoteFiles = @($pullFiles | Out-String | ConvertFrom-Json |
              Where-Object { $_.filename -like "$manifestPath/*" })
            Assert-WinGetRemoteFiles $remoteFiles
          }

          $publicListing = gh api "repos/microsoft/winget-pkgs/contents/${manifestPath}?ref=master" 2>&1
          $publicStatus = $LASTEXITCODE
          if ($publicStatus -eq 0) {
            $entries = @($publicListing | Out-String | ConvertFrom-Json)
            $remoteFiles = @($entries | ForEach-Object {
              [pscustomobject]@{ filename = "$manifestPath/$($_.name)"; raw_url = $_.download_url }
            })
            Assert-WinGetRemoteFiles $remoteFiles
            $catalogCommit = (gh api --method GET repos/microsoft/winget-pkgs/commits -f path="$manifestPath" -f per_page=1 --jq '.[0].sha').Trim()
            if ($LASTEXITCODE -ne 0 -or $catalogCommit -notmatch '^[a-f0-9]{40}$') {
              throw 'Unable to resolve exact public WinGet catalog commit'
            }
            Write-WinGetEvidence 'public-exact' "github:microsoft/winget-pkgs@$catalogCommit#$manifestPath" $null $catalogCommit $true
            exit 0
          }
          if (($publicListing | Out-String) -notmatch 'HTTP 404') {
            throw 'Unable to query public WinGet catalog reliably'
          }

          $submitter = (gh api user --jq .login).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($submitter)) {
            throw 'Unable to resolve WinGet submitting identity'
          }
          $pullTitle = "GuardScan $version [$($manifestDigest.Substring(0, 12))]"
          $pullRequest = Find-WinGetPullRequest $submitter $pullTitle
          if ($null -ne $pullRequest) {
            Assert-WinGetPullRequest $pullRequest
            Write-WinGetEvidence 'pending' "github:microsoft/winget-pkgs/pull/$($pullRequest.number)@$($pullRequest.head.sha)#$manifestPath" $($pullRequest.number) $($pullRequest.head.sha) $false
            exit 0
          }

          git fetch origin release-ledger
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch protected release ledger' }
          $ledgerPath = "events/$($env:RELEASE_TAG).jsonl"
          $ledgerEntry = git ls-tree --name-only origin/release-ledger -- $ledgerPath
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect protected release ledger' }
          if (-not [string]::IsNullOrWhiteSpace(($ledgerEntry | Out-String))) {
            $ledgerLines = git show "origin/release-ledger:$ledgerPath"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read protected release ledger' }
            $existing = $ledgerLines | ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.type -eq 'channel_submitted' -and $_.channel -eq 'winget' } |
              Select-Object -Last 1
            if ($null -ne $existing) {
              if ($existing.payload.remoteDigest -ne $manifestDigest) {
                throw 'WinGet protected-ledger digest conflicts with rendered manifests'
              }
              if ($null -eq $existing.payload.submission) {
                throw 'WinGet protected-ledger evidence is incomplete'
              }
              $existing.payload.submission | ConvertTo-Json -Depth 8 | Out-File winget-evidence.json -Encoding utf8
              Write-Host 'WinGet pending provider state is not stronger than recorded evidence; the protected release ledger prevents a blind duplicate.'
              exit 0
            }
          }

          $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/v$env:RELEASE_WINGETCREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest $wingetCreateUrl -OutFile wingetcreate.exe
          $wingetCreateDigest = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wingetCreateDigest -ne $env:RELEASE_WINGETCREATE_SHA256) {
            throw 'Pinned wingetcreate executable failed SHA-256 verification'
          }
          & .\wingetcreate.exe submit --prtitle "$pullTitle" --no-open --token $env:WINGET_GITHUB_TOKEN $manifestDirectory
          if ($LASTEXITCODE -ne 0) { throw 'WinGet submission failed' }
          for ($attempt = 0; $attempt -lt 30; $attempt += 1) {
            $pullRequest = Find-WinGetPullRequest $submitter $pullTitle
            if ($null -ne $pullRequest) { break }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $pullRequest) { throw 'Submitted WinGet pull request identity did not become queryable' }
          Assert-WinGetPullRequest $pullRequest
          Write-WinGetEvidence 'submitted' "github:microsoft/winget-pkgs/pull/$($pullRequest.number)@$($pullRequest.head.sha)#$manifestPath" $($pullRequest.number) $($pullRequest.head.sha) $false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-winget-evidence-${{ inputs.tag }}
          path: winget-evidence.json
          if-no-files-found: error
          retention-days: 30

  chocolatey:
    name: Chocolatey submission
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true' && inputs.channel == 'stable'
    runs-on: windows-2025
    needs: [github]
    environment: chocolatey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci
      - working-directory: cli
        run: npm run release:render -- --manifest ../payload/release-manifest.json --output-dir ../adapters
      - name: Pack and test Chocolatey from a local feed
        shell: pwsh
        run: |
          if ($null -eq (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw 'Chocolatey is unavailable on the selected Windows runner'
          }
          New-Item -ItemType Directory -Force local-feed | Out-Null
          Push-Location adapters\chocolatey
          choco pack guardscan.nuspec --output-directory ..\..\local-feed
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey package creation failed' }
          Pop-Location
          choco install guardscan --source "$(Resolve-Path local-feed)" --yes
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey local-feed installation failed' }
          $installedVersion = (& guardscan --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $installedVersion -ne '${{ inputs.tag }}'.TrimStart('v')) {
            throw 'Chocolatey local-feed invocation or version check failed'
          }
          choco uninstall guardscan --yes
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey local-feed uninstall failed' }
      - name: Preflight and submit Chocolatey package with exact evidence
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $package = Get-ChildItem local-feed\*.nupkg | Select-Object -First 1
          if ($null -eq $package) { throw 'Chocolatey package is missing' }
          $packageDigest = (Get-FileHash $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $packageIdentity = "guardscan@$version"
          $publicUrl = "https://community.chocolatey.org/api/v2/package/guardscan/$version"

          function Write-ChocolateyEvidence($state, $remoteIdentity, $publicBytesVerified) {
            [ordered]@{
              schemaVersion = 'guardscan.moderated-submission.v1'
              channel = 'chocolatey'
              version = $version
              tag = $env:RELEASE_TAG
              state = $state
              packageIdentity = $packageIdentity
              packageFilename = $package.Name
              remoteIdentity = $remoteIdentity
              remoteDigest = $packageDigest
              provider = [ordered]@{
                url = $publicUrl
                publicBytesVerified = $publicBytesVerified
                pendingStateQuery = 'public package bytes only; protected release ledger prevents a blind duplicate after recorded submission'
              }
              checkedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
            } | ConvertTo-Json -Depth 8 | Out-File chocolatey-evidence.json -Encoding utf8
          }

          $public = $false
          try {
            Invoke-WebRequest $publicUrl -OutFile public-guardscan.nupkg
            $public = $true
          } catch {
            $statusCode = if ($null -ne $_.Exception.Response) {
              [int]$_.Exception.Response.StatusCode
            } else { 0 }
            if ($statusCode -ne 404) { throw 'Unable to query public Chocolatey package reliably' }
          }
          if ($public) {
            $publicDigest = (Get-FileHash public-guardscan.nupkg -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($publicDigest -ne $packageDigest) {
              throw 'Chocolatey public package integrity conflict'
            }
            Write-ChocolateyEvidence 'public-exact' $publicUrl $true
            exit 0
          }

          git fetch origin release-ledger
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch protected release ledger' }
          $ledgerPath = "events/$($env:RELEASE_TAG).jsonl"
          $ledgerEntry = git ls-tree --name-only origin/release-ledger -- $ledgerPath
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect protected release ledger' }
          if (-not [string]::IsNullOrWhiteSpace(($ledgerEntry | Out-String))) {
            $ledgerLines = git show "origin/release-ledger:$ledgerPath"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read protected release ledger' }
            $existing = $ledgerLines | ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object { $_.type -eq 'channel_submitted' -and $_.channel -eq 'chocolatey' } |
              Select-Object -Last 1
            if ($null -ne $existing) {
              if ($existing.payload.remoteDigest -ne $packageDigest) {
                throw 'Chocolatey protected-ledger digest conflicts with rendered package'
              }
              if ($null -eq $existing.payload.submission) {
                throw 'Chocolatey protected-ledger evidence is incomplete'
              }
              $existing.payload.submission | ConvertTo-Json -Depth 8 | Out-File chocolatey-evidence.json -Encoding utf8
              Write-Host 'Chocolatey pending moderation cannot be queried reliably; the protected release ledger prevents a blind duplicate.'
              exit 0
            }
          }

          choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey submission failed' }
          Write-ChocolateyEvidence 'submitted' "chocolatey:$packageIdentity" $false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-chocolatey-evidence-${{ inputs.tag }}
          path: chocolatey-evidence.json
          if-no-files-found: error
          retention-days: 30
