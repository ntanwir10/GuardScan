name: Reusable multi-channel publication

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      tag:
        type: string
        required: true
      channel:
        type: string
        required: true
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
      WINGET_GITHUB_TOKEN:
        required: false
      WINGET_CREATE_GITHUB_TOKEN:
        required: false
      CHOCO_API_KEY:
        required: false

permissions:
  contents: read

env:
  RELEASE_NODE_VERSION: 22.23.1
  RELEASE_NPM_VERSION: 11.21.0
  RELEASE_WINGETCREATE_VERSION: 1.12.13.0
  RELEASE_WINGETCREATE_SHA256: 24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea
  RELEASE_INPUT_REF: ${{ inputs.ref }}
  RELEASE_INPUT_TAG: ${{ inputs.tag }}
  RELEASE_INPUT_CHANNEL: ${{ inputs.channel }}

jobs:
  github:
    name: Immutable GitHub release
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.channel == 'rc' && 'release-rc' || 'release-stable' }}
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload
      - name: Reuse existing immutable tag payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName,assets,isDraft,body \
            > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-lookup-error"; then
            jq -e --arg tag "$RELEASE_TAG" '
              .tagName == $tag and
              ([.assets[].name] | length == (unique | length)) and
              all(.assets[]; .name | test("^[A-Za-z0-9][A-Za-z0-9._+~-]*$"))
            ' "$RUNNER_TEMP/existing-release.json" >/dev/null
            node cli/scripts/release/canonical-payload.js pointer \
              "$RUNNER_TEMP/existing-release.json" "$RELEASE_TAG" > "$RUNNER_TEMP/canonical-pointer.json"
            if [ "$(jq '.isDraft' "$RUNNER_TEMP/existing-release.json")" = true ] \
              && [ "$(jq 'type' "$RUNNER_TEMP/canonical-pointer.json")" = '"object"' ]; then
              # Authenticate the pointer producer before either immutable recovery path.
              RUN_ID="$(jq -r '.runId' "$RUNNER_TEMP/canonical-pointer.json")"
              ATTEMPT="$(jq -r '.runAttempt' "$RUNNER_TEMP/canonical-pointer.json")"
              ARTIFACT="$(jq -r '.artifact' "$RUNNER_TEMP/canonical-pointer.json")"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$RUN_ID/attempts/$ATTEMPT" \
                > "$RUNNER_TEMP/canonical-producer.json"
              jq -e --arg repository "$GITHUB_REPOSITORY" --arg run_id "$RUN_ID" --arg attempt "$ATTEMPT" '
                ((.path | split("@")[0]) == ".github/workflows/release-train.yml") and
                .event == "workflow_dispatch" and .head_branch == "main" and
                (.repository.full_name | ascii_downcase) == ($repository | ascii_downcase) and
                (.head_repository.full_name | ascii_downcase) == ($repository | ascii_downcase) and
                (.id | tostring) == $run_id and (.run_attempt | tostring) == $attempt
              ' "$RUNNER_TEMP/canonical-producer.json" >/dev/null
              if gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" \
                --dir canonical-artifact-download 2> "$RUNNER_TEMP/canonical-artifact-download-error"; then
                node cli/scripts/release/canonical-payload.js verify \
                  canonical-artifact-download "$RUNNER_TEMP/canonical-pointer.json"
                mv payload rebuilt-payload
                mv canonical-artifact-download payload
              else
                DOWNLOAD_ERROR="$(cat "$RUNNER_TEMP/canonical-artifact-download-error")"
                case "$DOWNLOAD_ERROR" in
                  'no valid artifacts found to download'|'no artifact matches any of the names or patterns provided') ;;
                  *)
                    echo 'Canonical artifact download failed for a reason other than artifact unavailability; refusing publication.' >&2
                    exit 1
                    ;;
                esac
                # Keep any partial artifact download isolated. Only a complete draft asset set
                # that matches the original pointer may recover an unavailable artifact.
                jq -e '[.assets[].name] | index("release-manifest.json") != null and
                  index("SHA256SUMS") != null and index("SHA256SUMS.sigstore.json") != null' \
                  "$RUNNER_TEMP/existing-release.json" >/dev/null || {
                    echo 'Existing draft has incomplete canonical evidence; refusing recovery.' >&2
                    exit 1
                  }
                mkdir canonical-draft-assets
                gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir canonical-draft-assets
                node cli/scripts/release/canonical-payload.js verify \
                  canonical-draft-assets "$RUNNER_TEMP/canonical-pointer.json"
                mv payload rebuilt-payload
                mv canonical-draft-assets payload
              fi
            elif [ "$(jq '.assets | length' "$RUNNER_TEMP/existing-release.json")" -gt 0 ]; then
              # Never replace already published run-specific signatures/manifests with a rebuild.
              jq -e '[.assets[].name] | index("release-manifest.json") != null and
                index("SHA256SUMS") != null and index("SHA256SUMS.sigstore.json") != null' \
                "$RUNNER_TEMP/existing-release.json" >/dev/null || {
                  echo 'Existing draft has incomplete canonical evidence; refusing to rebuild over it.' >&2
                  exit 1
                }
              mkdir canonical-payload
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir canonical-payload
              if [ "$(jq 'type' "$RUNNER_TEMP/canonical-pointer.json")" = '"object"' ]; then
                node cli/scripts/release/canonical-payload.js verify canonical-payload "$RUNNER_TEMP/canonical-pointer.json"
              fi
              mv payload rebuilt-payload
              mv canonical-payload payload
            fi
          elif ! grep -Eq '^release not found$|HTTP 404' "$RUNNER_TEMP/release-lookup-error"; then
            echo 'Could not determine immutable tag payload state; refusing publication.' >&2
            exit 1
          fi
      - uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2
      - name: Authenticate release-build producer and verify payload
        id: release-build-identity
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.tag }}
        run: |
          VERSION="${VERSION#v}"
          PRODUCER_RUN_ID="$(jq -er '.producer.runId | select(type == "string" and test("^[1-9][0-9]{0,19}$"))' payload/release-manifest.json)"
          PRODUCER_ATTEMPT="$(jq -er '.producer.runAttempt | select(type == "number" and floor == . and . > 0 and . <= 1000)' payload/release-manifest.json)"
          BUILD_RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$PRODUCER_RUN_ID/attempts/$PRODUCER_ATTEMPT")"
          jq -e --arg repository "$GITHUB_REPOSITORY" \
            --arg run_id "$PRODUCER_RUN_ID" --arg attempt "$PRODUCER_ATTEMPT" '
              ((.path | split("@")[0]) == ".github/workflows/release-train.yml") and
              .event == "workflow_dispatch" and .head_branch == "main" and
              (.repository.full_name | ascii_downcase) == ($repository | ascii_downcase) and
              (.head_repository.full_name | ascii_downcase) == ($repository | ascii_downcase) and
              (.id | tostring) == $run_id and (.run_attempt | tostring) == $attempt and
              (.head_sha | test("^[a-f0-9]{40}$"))
            ' <<< "$BUILD_RUN" >/dev/null || {
              echo 'Authenticated release-train producer run does not match the trusted main workflow.' >&2
              exit 1
            }
          BUILD_WORKFLOW_SHA="$(jq -er '.head_sha' <<< "$BUILD_RUN")"
          cosign verify-blob \
            --bundle payload/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@refs/heads/main" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-sha "$BUILD_WORKFLOW_SHA" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            payload/SHA256SUMS
          node cli/scripts/release/checksum-inventory.js payload
          (cd payload && sha256sum --check SHA256SUMS)
          TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/v$VERSION" --jq .sha)"
          jq -e --arg repository "$GITHUB_REPOSITORY" --arg version "$VERSION" \
            --arg run_id "$PRODUCER_RUN_ID" --arg attempt "$PRODUCER_ATTEMPT" \
            --arg workflow_sha "$BUILD_WORKFLOW_SHA" --arg tag_sha "$TAG_SHA" '
              .schemaVersion == "guardscan.release-manifest.v1" and
              .version == $version and .tag == ("v" + $version) and .commit == $tag_sha and
              .producer.provider == "github-actions" and
              (.producer.repository | ascii_downcase) == ($repository | ascii_downcase) and
              .producer.workflow == ".github/workflows/release-build.yml" and
              .producer.workflowSha == $workflow_sha and
              .producer.runId == $run_id and (.producer.runAttempt | tostring) == $attempt and
              .producer.sourceRef == ("refs/tags/v" + $version)
            ' payload/release-manifest.json >/dev/null || {
              echo 'Signed release manifest does not match the exact train and immutable tag.' >&2
              exit 1
            }
          echo "workflow_sha=$BUILD_WORKFLOW_SHA" >> "$GITHUB_OUTPUT"
      - name: Restore npm artifact from authenticated canonical payload
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node cli/scripts/release/restore-npm-payload.js payload canonical-npm "$RELEASE_TAG"
      - name: Check shared mutable tag state before publication
        working-directory: cli
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          DIST_TAG=latest
          if [ "$RELEASE_CHANNEL" = rc ]; then DIST_TAG=next; fi
          : > "$RUNNER_TEMP/shared-tag-state"
          npm run release:npm-preflight -- --artifact-dir ../canonical-npm \
            --expected-dist-tag "$DIST_TAG" --github-output "$RUNNER_TEMP/shared-tag-state"
          if grep -Fxq 'dist-tag-repair-required=true' "$RUNNER_TEMP/shared-tag-state"; then
            echo 'Shared npm tag drift requires authority outside trusted publication; refusing all channel writes.' >&2
            exit 1
          fi
      - name: Create or reuse draft and upload only missing identical assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_INPUT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release-integrity incident: publication has no persisted checkpoint release"
            exit 1
          fi
          RELEASE_JSON="$(gh release view "$RELEASE_INPUT_TAG" \
            --repo "${{ github.repository }}" --json isDraft,isPrerelease)"
          jq -e '.isDraft | type == "boolean"' <<< "$RELEASE_JSON" >/dev/null
          jq -e '.isPrerelease | type == "boolean"' <<< "$RELEASE_JSON" >/dev/null
          IS_DRAFT="$(jq -r '.isDraft' <<< "$RELEASE_JSON")"
          IS_PRERELEASE="$(jq -r '.isPrerelease' <<< "$RELEASE_JSON")"
          EXPECTED_PRERELEASE=false
          if [ "$RELEASE_INPUT_CHANNEL" = rc ]; then EXPECTED_PRERELEASE=true; fi
          if [ "$IS_PRERELEASE" != "$EXPECTED_PRERELEASE" ]; then
            echo 'Release channel mismatch: existing release prerelease state differs from requested channel.' >&2
            exit 1
          fi
          while IFS= read -r -d '' FILE; do
            NAME="$(basename "$FILE")"
            ASSET_JSON="$(gh release view "$RELEASE_INPUT_TAG" --repo "${{ github.repository }}" --json assets)"
            ASSET_API_URL="$(jq -er --arg name "$NAME" --arg repository "$GITHUB_REPOSITORY" '
              [.assets[]? | select(.name == $name)] as $matches |
              if ($matches | length) > 1 then error("duplicate release asset name")
              elif ($matches | length) == 0 then ""
              else $matches[0] as $asset |
                ("https://api.github.com/repos/" + $repository + "/releases/assets/") as $base |
                if ($asset.id | type) != "string" or ($asset.id | length) == 0
                    or ($asset.id | test("[[:cntrl:]]"))
                    or ($asset.apiUrl | type) != "string"
                then error("invalid release asset identity")
                elif ($asset.apiUrl | startswith($base)) | not
                then error("release asset URL is not the canonical same-repository API identity")
                else $asset.apiUrl[($base | length):] as $databaseId |
                  if ($databaseId | test("^[1-9][0-9]*$"))
                  then $base + $databaseId
                  else error("invalid release asset database ID") end
                end
              end
            ' <<<"$ASSET_JSON")"
            if [ -n "$ASSET_API_URL" ]; then
              gh api \
                -H "Accept: application/octet-stream" \
                "$ASSET_API_URL" \
                > "$RUNNER_TEMP/$NAME"
              if ! cmp --silent "$FILE" "$RUNNER_TEMP/$NAME"; then
                echo "::error::Release-integrity incident: $NAME already exists with different bytes"
                exit 1
              fi
            else
              if [ "$IS_DRAFT" != true ]; then
                echo "::error::Published release is missing required immutable asset $NAME"
                exit 1
              fi
              gh release upload "$RELEASE_INPUT_TAG" "$FILE" --repo "$GITHUB_REPOSITORY"
            fi
          done < <(find payload -maxdepth 1 -type f -print0 | sort -z)
      - name: Redownload and verify every draft asset before publication
        env:
          BUILD_WORKFLOW_SHA: ${{ steps.release-build-identity.outputs.workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir redownload
          gh release download "$RELEASE_INPUT_TAG" \
            --repo "${{ github.repository }}" \
            --dir redownload
          mkdir checkpoint-redownload
          find redownload -maxdepth 1 -type f \
            -name 'guardscan-release-checkpoint-*' \
            -exec mv {} checkpoint-redownload/ \;
          diff -u <(find payload -maxdepth 1 -type f -printf '%f\n' | sort) \
            <(find redownload -maxdepth 1 -type f -printf '%f\n' | sort)
          cosign verify-blob \
            --bundle redownload/SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-build.yml@refs/heads/main" \
            --certificate-github-workflow-ref "refs/heads/main" \
            --certificate-github-workflow-sha "$BUILD_WORKFLOW_SHA" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            redownload/SHA256SUMS
          (cd redownload && sha256sum --check SHA256SUMS)
      - name: Bind the exact GitHub release asset set to provider evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node - <<'NODE'
          const crypto = require('crypto');
          const fs = require('fs');
          const path = require('path');
          const {writePublicationEvidence} = require('./cli/scripts/release/publication-evidence');
          const files = {};
          for (const entry of fs.readdirSync('redownload', {withFileTypes: true})) {
            if (!entry.isFile()) throw new Error('GitHub release evidence contains a non-file');
            files[entry.name] = crypto.createHash('sha256')
              .update(fs.readFileSync(path.join('redownload', entry.name))).digest('hex');
          }
          writePublicationEvidence('github-publication-evidence.json', {
            channel: 'github',
            version: process.env.RELEASE_TAG.slice(1),
            tag: process.env.RELEASE_TAG,
            remoteIdentity: `github:${process.env.GITHUB_REPOSITORY}/releases/tag/${process.env.RELEASE_TAG}`,
            files,
          });
          NODE
      - name: Remove private checkpoint only after the expanded draft is complete
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_TAG" \
              --jq '.assets[] | select(.name | startswith("guardscan-release-checkpoint-")) | .id' \
              > checkpoint-asset-ids.txt
            while IFS= read -r ASSET_ID; do
              if [ -n "$ASSET_ID" ]; then
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/$ASSET_ID"
              fi
            done < checkpoint-asset-ids.txt
          fi
      - name: Revalidate exact release asset IDs and digests immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$RELEASE_INPUT_TAG" > release-before-publication.json
          node - <<'NODE'
          const crypto = require('crypto');
          const cp = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const release = JSON.parse(fs.readFileSync('release-before-publication.json'));
          if (!release.draft) throw new Error('release became public before final asset verification');
          const assets = new Map((release.assets || []).map(asset => [asset.name, asset]));
          for (const name of fs.readdirSync('redownload')) {
            const asset = assets.get(name);
            if (!asset || !Number.isSafeInteger(asset.id)) throw new Error(`release asset identity is missing for ${name}`);
            const bytes = cp.execFileSync('gh', [
              'api', '-H', 'Accept: application/octet-stream',
              `repos/${process.env.GITHUB_REPOSITORY}/releases/assets/${asset.id}`,
            ], {maxBuffer: 128 * 1024 * 1024});
            const digest = crypto.createHash('sha256').update(bytes).digest('hex');
            const expected = crypto.createHash('sha256').update(fs.readFileSync(path.join('redownload', name))).digest('hex');
            if (digest !== expected) throw new Error(`release asset bytes changed before publication: ${name}`);
          }
          NODE
      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(gh release view "$RELEASE_INPUT_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$RELEASE_INPUT_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-npm-${{ inputs.tag }}
          path: canonical-npm/
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-github-evidence-${{ inputs.tag }}
          path: github-publication-evidence.json
          if-no-files-found: error
          retention-days: 30

  npm:
    name: npm trusted publication
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    needs: [github]
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - id: download-npm-artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-npm-${{ inputs.tag }}
          path: npm-artifact
      - name: Require artifact-service digest before npm publication
        env:
          ARTIFACT_DIGEST: ${{ steps.download-npm-artifact.outputs.artifact-digest }}
        run: test -n "$ARTIFACT_DIGEST"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          registry-url: https://registry.npmjs.org
      - name: Install OIDC-compatible npm
        run: |
          npm install --global "npm@${RELEASE_NPM_VERSION}"
          test "$(npm --version)" = "$RELEASE_NPM_VERSION"
      - working-directory: cli
        run: npm ci --ignore-scripts
      - name: Verify and classify registry state
        id: preflight
        working-directory: cli
        run: |
          DIST_TAG=latest
          if [ "$RELEASE_INPUT_CHANNEL" = rc ]; then DIST_TAG=next; fi
          npm run release:npm-preflight -- \
            --artifact-dir ../npm-artifact \
            --expected-dist-tag "$DIST_TAG" \
            --github-output "$GITHUB_OUTPUT"
      - name: Refuse existing-version dist-tag drift outside trusted-publishing authority
        if: steps.preflight.outputs.dist-tag-repair-required == 'true'
        run: |
          echo 'The expected npm dist-tag points to another version; trusted publishing cannot repair it.' >&2
          exit 1
      - name: Publish exact tested tarball
        if: steps.preflight.outputs.publish-required == 'true'
        working-directory: cli
        run: |
          DIST_TAG=latest
          if [ "$RELEASE_INPUT_CHANNEL" = rc ]; then DIST_TAG=next; fi
          npm publish "../npm-artifact/${{ steps.preflight.outputs.filename }}" \
            --access public --provenance --tag "$DIST_TAG"
      - name: Verify public registry integrity
        working-directory: cli
        run: |
          DIST_TAG=latest
          if [ "$RELEASE_INPUT_CHANNEL" = rc ]; then DIST_TAG=next; fi
          for ATTEMPT in $(seq 1 30); do
            : > "$RUNNER_TEMP/npm-preflight-output"
            npm run release:npm-preflight -- \
              --artifact-dir ../npm-artifact \
              --expected-dist-tag "$DIST_TAG" \
              --github-output "$RUNNER_TEMP/npm-preflight-output"
            if grep -Fxq 'publish-required=false' "$RUNNER_TEMP/npm-preflight-output" \
              && grep -Fxq 'matching=true' "$RUNNER_TEMP/npm-preflight-output" \
              && grep -Fxq 'dist-tag-repair-required=false' "$RUNNER_TEMP/npm-preflight-output"; then
              break
            fi
            sleep 10
          done
          grep -Fx 'publish-required=false' "$RUNNER_TEMP/npm-preflight-output"
          grep -Fx 'matching=true' "$RUNNER_TEMP/npm-preflight-output"
          grep -Fx 'dist-tag-repair-required=false' "$RUNNER_TEMP/npm-preflight-output"
      - name: Bind the exact npm tarball to provider evidence
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const {writePublicationEvidence} = require('./cli/scripts/release/publication-evidence');
          const artifact = JSON.parse(fs.readFileSync('npm-artifact/npm-artifact.json'));
          writePublicationEvidence('npm-publication-evidence.json', {
            channel: 'npm',
            version: process.env.RELEASE_TAG.slice(1),
            tag: process.env.RELEASE_TAG,
            remoteIdentity: `npm:${artifact.packageName}@${artifact.version}`,
            files: {[artifact.filename]: artifact.sha256},
          });
          NODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-npm-evidence-${{ inputs.tag }}
          path: npm-publication-evidence.json
          if-no-files-found: error
          retention-days: 30

  catalog:
    name: Shared Homebrew and Scoop catalog projection
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    needs: [github]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci --ignore-scripts
      - name: Render the cryptographically bound shared catalog projection
        env:
          RELEASE_REF: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if command -v sha256sum >/dev/null 2>&1; then
            MANIFEST_SHA256="$(sha256sum payload/release-manifest.json | cut -d ' ' -f 1)"
          else
            MANIFEST_SHA256="$(shasum -a 256 payload/release-manifest.json | cut -d ' ' -f 1)"
          fi
          node cli/scripts/release/index.js catalog \
            --manifest payload/release-manifest.json \
            --output-dir catalog-output \
            --manifest-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/release-manifest.json" \
            --manifest-sha256 "$MANIFEST_SHA256" \
            --generator-repository "$GITHUB_REPOSITORY" \
            --generator-commit "$RELEASE_REF" \
            --package-root "$GITHUB_WORKSPACE/source/cli" \
            --repository-root "$GITHUB_WORKSPACE/source" \
            --schema-root "$GITHUB_WORKSPACE/cli"
      - name: Validate complete generated catalog projection
        run: |
          test -f catalog-output/Formula/guardscan.rb
          test -f catalog-output/bucket/guardscan.json
          test -f catalog-output/channel-lock.json
          test -f catalog/homebrew-tap/.github/workflows/verify.yml
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const lock = JSON.parse(fs.readFileSync('catalog-output/channel-lock.json'));
          if (lock.schemaVersion !== 'guardscan.channel-catalog.v1') {
            throw new Error('unexpected channel catalog schema');
          }
          const expected = new Map([
            ['Formula/guardscan.rb', 'catalog-output/Formula/guardscan.rb'],
            ['bucket/guardscan.json', 'catalog-output/bucket/guardscan.json'],
          ]);
          for (const [target, source] of expected) {
            const digest = crypto.createHash('sha256').update(fs.readFileSync(source)).digest('hex');
            if (lock.files?.[target]?.sha256 !== digest) {
              throw new Error(`channel-lock digest mismatch for ${target}`);
            }
          }
          NODE
      - name: Create short-lived release app token after projection validation
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ntanwir10
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write
          permission-metadata: read
      - name: Push one deterministic catalog update
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          CATALOG_REPOSITORY="ntanwir10/homebrew-tap"
          gh auth setup-git --hostname github.com
          if [ "$RELEASE_CHANNEL" = rc ]; then
            BRANCH="channel-preview/$RELEASE_TAG"
          else
            BRANCH="guardscan/$RELEASE_TAG"
          fi
          gh repo clone "$CATALOG_REPOSITORY" catalog-checkout
          (
            cd catalog-checkout
            git config user.name guardscan-release-bot
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            projection_matches() {
              for SPEC in \
                "../catalog-output/Formula/guardscan.rb:Formula/guardscan.rb" \
                "../catalog-output/bucket/guardscan.json:bucket/guardscan.json" \
                "../catalog-output/channel-lock.json:channel-lock.json" \
                "../catalog/homebrew-tap/.github/workflows/verify.yml:.github/workflows/verify.yml"; do
                IFS=: read -r SOURCE TARGET <<< "$SPEC"
                if [ ! -f "$TARGET" ] || ! cmp --silent "$SOURCE" "$TARGET"; then
                  return 1
                fi
              done
            }
            assert_exact_projection_branch() {
              git merge-base --is-ancestor origin/main HEAD || {
                echo "::error::Release-integrity incident: $BRANCH is not based on catalog main"
                exit 1
              }
              CHANGED_PATHS="$(git diff --name-only origin/main...HEAD | LC_ALL=C sort)"
              EXPECTED_PATHS="$(printf '%s\n' \
                Formula/guardscan.rb \
                bucket/guardscan.json \
                channel-lock.json)"
              ACTUAL_GENERATED_PATHS="$(printf '%s\n' "$CHANGED_PATHS" | grep -Fvx '.github/workflows/verify.yml' || true)"
              test "$ACTUAL_GENERATED_PATHS" = "$EXPECTED_PATHS" || {
                echo "::error::Release-integrity incident: $BRANCH contains an unexpected diff"
                printf '%s\n' "$CHANGED_PATHS" >&2
                exit 1
              }
              projection_matches || {
                echo "::error::Release-integrity incident: $BRANCH projection bytes differ"
                exit 1
              }
            }
            MAIN_ALREADY_CURRENT=false
            if [ "$RELEASE_CHANNEL" = stable ] && projection_matches; then
              MAIN_ALREADY_CURRENT=true
              BRANCH=main
            elif [ "$RELEASE_CHANNEL" = stable ] && [ -f channel-lock.json ]; then
              EXISTING_TAG="$(node -p 'require("./channel-lock.json").source?.tag || ""')"
              if [ "$EXISTING_TAG" = "$RELEASE_TAG" ]; then
                echo "::error::Release-integrity incident: main has this release identity with different catalog bytes"
                exit 1
              fi
            fi
            if [ "$MAIN_ALREADY_CURRENT" = true ]; then
              PR_NUMBER=
              PR_STATE=MERGED
            elif git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
              git switch --detach "origin/$BRANCH"
              assert_exact_projection_branch
            else
              git switch -c "$BRANCH" origin/main
              mkdir -p Formula bucket .github/workflows
              cp ../catalog-output/Formula/guardscan.rb Formula/guardscan.rb
              cp ../catalog-output/bucket/guardscan.json bucket/guardscan.json
              cp ../catalog-output/channel-lock.json channel-lock.json
              cp ../catalog/homebrew-tap/.github/workflows/verify.yml .github/workflows/verify.yml
              git add Formula/guardscan.rb bucket/guardscan.json channel-lock.json .github/workflows/verify.yml
              git commit -m "guardscan $RELEASE_TAG"
              assert_exact_projection_branch
              git -c credential.helper= -c 'credential.https://github.com.helper=!gh auth git-credential' push \
                --force-with-lease="refs/heads/$BRANCH" origin HEAD:"$BRANCH"
            fi
            CATALOG_COMMIT="$(git rev-parse HEAD)"
            if [ "$MAIN_ALREADY_CURRENT" = true ]; then
              PR_NUMBER="$(gh api \
                "repos/$CATALOG_REPOSITORY/commits/$CATALOG_COMMIT/pulls" \
                --jq '.[0].number')"
              if [ -z "$PR_NUMBER" ]; then
                PR_NUMBER="$(gh pr list --repo "$CATALOG_REPOSITORY" \
                  --search "\"GuardScan $RELEASE_TAG\" in:title" \
                  --state merged --limit 1 --json number --jq '.[0].number')"
              fi
              if [ -z "$PR_NUMBER" ]; then
                echo "::error::Current catalog bytes have no merged GuardScan projection PR"
                exit 1
              fi
              PR_STATE=MERGED
            else
              PR_NUMBER="$(gh pr list --repo "$CATALOG_REPOSITORY" \
                --head "$BRANCH" --state all --limit 1 --json number --jq '.[0].number')"
              if [ -z "$PR_NUMBER" ]; then
                PR_ARGS=(
                  --repo "$CATALOG_REPOSITORY"
                  --base main
                  --head "$BRANCH"
                  --title "GuardScan $RELEASE_TAG"
                  --body "Generated from GuardScan's immutable release manifest and bound by channel-lock.json."
                )
                if [ "$RELEASE_CHANNEL" = rc ]; then PR_ARGS+=(--draft); fi
                gh pr create "${PR_ARGS[@]}"
                PR_NUMBER="$(gh pr list --repo "$CATALOG_REPOSITORY" \
                  --head "$BRANCH" --state all --limit 1 --json number --jq '.[0].number')"
              fi
            fi
            EXPECTED_HEAD=""
            MERGE_SHA=""
            validate_pr_details() {
              export PR_DETAILS EXPECTED_HEAD CATALOG_REPOSITORY
              node - <<'NODE'
          const pr = JSON.parse(process.env.PR_DETAILS);
          const expectedHead = process.env.EXPECTED_HEAD;
          if (pr.baseRefName !== 'main'
              || pr.headRepository?.nameWithOwner !== process.env.CATALOG_REPOSITORY
              || !/^[a-f0-9]{40}$/.test(pr.headRefOid || '')
              || (expectedHead && pr.headRefOid !== expectedHead)
              || !['OPEN', 'MERGED'].includes(pr.state)) {
            throw new Error('catalog pull request is not bound to the expected repository, base, and head');
          }
          if (pr.state === 'MERGED' && !/^[a-f0-9]{40}$/.test(pr.mergeCommit?.oid || '')) {
            throw new Error('merged catalog pull request has no actual merge commit');
          }
          NODE
            }
            if [ "$MAIN_ALREADY_CURRENT" = true ]; then
              PR_DETAILS="$(gh pr view --repo "$CATALOG_REPOSITORY" "$PR_NUMBER" \
                --json state,headRefOid,baseRefName,headRepository,mergeCommit)"
              validate_pr_details
              PR_STATE="$(node -p 'JSON.parse(process.env.PR_DETAILS).state')"
              test "$PR_STATE" = MERGED
              EXPECTED_HEAD="$(node -p 'JSON.parse(process.env.PR_DETAILS).headRefOid')"
              validate_pr_details
              MERGE_SHA="$(node -p 'JSON.parse(process.env.PR_DETAILS).mergeCommit.oid')"
              git fetch origin "$MERGE_SHA"
              git merge-base --is-ancestor "$MERGE_SHA" HEAD
            else
              EXPECTED_HEAD="$(git rev-parse HEAD)"
              PR_DETAILS="$(gh pr view --repo "$CATALOG_REPOSITORY" "$PR_NUMBER" \
                --json state,headRefOid,baseRefName,headRepository,mergeCommit)"
              validate_pr_details
              PR_STATE="$(node -p 'JSON.parse(process.env.PR_DETAILS).state')"
              git fetch origin main
              PROJECTION_BASE="$(git rev-parse FETCH_HEAD)"
              if [ "$PR_STATE" = MERGED ]; then
                MERGE_SHA="$(node -p 'JSON.parse(process.env.PR_DETAILS).mergeCommit.oid')"
                git fetch origin "$MERGE_SHA"
                PROJECTION_BASE="$(git rev-parse "$MERGE_SHA^1")"
              fi
              node -e 'require("../cli/scripts/release/adapter-projection").verifyCatalogProjection(process.cwd(), "../catalog-output", "../catalog/homebrew-tap/.github/workflows/verify.yml", ...process.argv.slice(1))' \
                "$EXPECTED_HEAD" "$PROJECTION_BASE"
              if [ "$RELEASE_CHANNEL" = stable ] && [ "$PR_STATE" != MERGED ]; then
                gh pr merge --repo "$CATALOG_REPOSITORY" "$PR_NUMBER" --squash --match-head-commit "$EXPECTED_HEAD"
                for ATTEMPT in $(seq 1 60); do
                  PR_DETAILS="$(gh pr view --repo "$CATALOG_REPOSITORY" "$PR_NUMBER" \
                    --json state,headRefOid,baseRefName,headRepository,mergeCommit)"
                  validate_pr_details
                  PR_STATE="$(node -p 'JSON.parse(process.env.PR_DETAILS).state')"
                  if [ "$PR_STATE" = MERGED ]; then break; fi
                  sleep 10
                done
              fi
            fi
            PR_DETAILS="$(gh pr view --repo "$CATALOG_REPOSITORY" "$PR_NUMBER" \
              --json state,headRefOid,baseRefName,headRepository,mergeCommit)"
            validate_pr_details
            PR_STATE="$(node -p 'JSON.parse(process.env.PR_DETAILS).state')"
            if [ "$RELEASE_CHANNEL" = stable ]; then test "$PR_STATE" = MERGED; fi
            git fetch origin "$EXPECTED_HEAD"
            git fetch origin main
            PROJECTION_BASE="$(git rev-parse FETCH_HEAD)"
            if [ "$PR_STATE" = MERGED ]; then
              MERGE_SHA="$(node -p 'JSON.parse(process.env.PR_DETAILS).mergeCommit.oid')"
              git fetch origin "$MERGE_SHA"
              PROJECTION_BASE="$(git rev-parse "$MERGE_SHA^1")"
            fi
            node -e 'require("../cli/scripts/release/adapter-projection").verifyCatalogProjection(process.cwd(), "../catalog-output", "../catalog/homebrew-tap/.github/workflows/verify.yml", ...process.argv.slice(1))' \
              "$EXPECTED_HEAD" "$PROJECTION_BASE"
            if [ "$PR_STATE" = MERGED ]; then
              MERGE_SHA="$(node -p 'JSON.parse(process.env.PR_DETAILS).mergeCommit.oid')"
              git fetch origin "$MERGE_SHA"
              node -e 'require("../cli/scripts/release/adapter-projection").verifyCatalogProjection(process.cwd(), "../catalog-output", "../catalog/homebrew-tap/.github/workflows/verify.yml", ...process.argv.slice(1))' \
                "$MERGE_SHA" "$(git rev-parse "$MERGE_SHA^1")"
              if [ "$MAIN_ALREADY_CURRENT" = true ]; then
                git merge-base --is-ancestor "$MERGE_SHA" HEAD
              fi
              for SPEC in \
                "../catalog-output/Formula/guardscan.rb:Formula/guardscan.rb" \
                "../catalog-output/bucket/guardscan.json:bucket/guardscan.json" \
                "../catalog-output/channel-lock.json:channel-lock.json" \
                "../catalog/homebrew-tap/.github/workflows/verify.yml:.github/workflows/verify.yml"; do
                IFS=: read -r SOURCE TARGET <<< "$SPEC"
                git show "$MERGE_SHA:$TARGET" > merged-catalog-file
                cmp --silent "$SOURCE" merged-catalog-file || {
                  echo "Merged catalog bytes differ from the release projection: $TARGET" >&2
                  exit 1
                }
              done
              CATALOG_COMMIT="$MERGE_SHA"
            else
              CATALOG_COMMIT="$EXPECTED_HEAD"
            fi
            export CATALOG_REPOSITORY BRANCH CATALOG_COMMIT EXPECTED_HEAD MERGE_SHA PR_NUMBER PR_STATE RELEASE_TAG
          node - <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const lock = fs.readFileSync('../catalog-output/channel-lock.json');
          fs.writeFileSync('../catalog-result.json', `${JSON.stringify({
            schemaVersion: 'guardscan.catalog-publication.v1',
            repository: process.env.CATALOG_REPOSITORY,
            branch: process.env.BRANCH,
            commit: process.env.CATALOG_COMMIT,
            headCommit: process.env.EXPECTED_HEAD,
            mergeCommit: process.env.MERGE_SHA || null,
            pullRequest: Number(process.env.PR_NUMBER),
            state: process.env.PR_STATE,
            lockSha256: crypto.createHash('sha256').update(lock).digest('hex'),
          }, null, 2)}\n`);
          NODE
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-catalog-${{ inputs.tag }}
          path: |
            catalog-output/channel-lock.json
            catalog-result.json
          if-no-files-found: error
          retention-days: 30

  winget:
    name: WinGet submission
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true' && inputs.channel == 'stable'
    runs-on: windows-2025
    needs: [github]
    environment: winget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - working-directory: cli
        run: npm ci --ignore-scripts
      - name: Render WinGet adapter with trusted tooling
        env:
          EXPECTED_TAG: ${{ inputs.tag }}
          EXPECTED_REF: ${{ inputs.ref }}
        run: |
          node cli/scripts/release/index.js render --manifest payload/release-manifest.json --output-dir adapters --package-root "$GITHUB_WORKSPACE/source/cli" --repository-root "$GITHUB_WORKSPACE/source" --schema-root "$GITHUB_WORKSPACE/cli"
      - name: Validate and install WinGet local manifest
        shell: pwsh
        run: |
          if ($null -eq (Get-Command winget -ErrorAction SilentlyContinue)) {
            throw 'WinGet is unavailable on the selected Windows runner'
          }
          $installers = @(Get-ChildItem adapters\winget -Filter '*.installer.yaml' -Recurse)
          if ($installers.Count -ne 1) { throw 'Expected exactly one rendered WinGet installer manifest' }
          $installer = $installers[0]
          if ($null -eq $installer) { throw 'Rendered WinGet installer manifest is missing' }
          $manifestDirectory = $installer.Directory.FullName
          winget validate --manifest $manifestDirectory
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed' }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw 'WinGet local manifest setting failed' }
          winget install --manifest $manifestDirectory --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw 'WinGet local manifest installation failed' }
          $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:PATH
          $installedVersion = (& guardscan --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $installedVersion -ne ($env:RELEASE_INPUT_TAG).TrimStart('v')) {
            throw 'WinGet local manifest invocation or version check failed'
          }
          winget uninstall --exact --id NaumanTanwir.GuardScan
          if ($LASTEXITCODE -ne 0) { throw 'WinGet local manifest uninstall failed' }
      - name: Preflight and submit WinGet manifests with exact evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $packageIdentity = "NaumanTanwir.GuardScan@$version"
          $manifestPath = "manifests/n/NaumanTanwir/GuardScan/$version"
          $installers = @(Get-ChildItem adapters\winget -Filter '*.installer.yaml' -Recurse)
          if ($installers.Count -ne 1) { throw 'Expected exactly one rendered WinGet installer manifest' }
          $installer = $installers[0]
          if ($null -eq $installer) { throw 'Rendered WinGet installer manifest is missing' }
          $manifestDirectory = $installer.Directory.FullName
          $localFiles = [ordered]@{}
          Get-ChildItem $manifestDirectory -File -Filter '*.yaml' | Sort-Object Name | ForEach-Object {
            $localFiles[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          if ($localFiles.Count -ne 3) { throw 'WinGet evidence requires exactly three rendered manifests' }
          $digestInput = ($localFiles.GetEnumerator() | ForEach-Object { "$($_.Key)`0$($_.Value)`n" }) -join ''
          [IO.File]::WriteAllText('winget-digest-input.txt', $digestInput, [Text.UTF8Encoding]::new($false))
          $manifestDigest = (Get-FileHash winget-digest-input.txt -Algorithm SHA256).Hash.ToLowerInvariant()

          function Write-WinGetEvidence($state, $remoteIdentity, $pullRequest, $commit, $publicBytesVerified, $reason = $null) {
            if ($null -eq $script:verifiedWinGet) { throw 'Authenticated WinGet file evidence is required' }
            $evidence = [ordered]@{
              schemaVersion = 'guardscan.moderated-submission.v1'
              channel = 'winget'
              version = $version
              tag = $env:RELEASE_TAG
              state = $state
              packageIdentity = $packageIdentity
              remoteIdentity = $remoteIdentity
              remoteDigest = $script:verifiedWinGet.remoteDigest
              files = $script:verifiedWinGet.files
              provider = [ordered]@{
                repository = 'microsoft/winget-pkgs'
                path = $manifestPath
                pullRequest = $pullRequest
                commit = $commit
                publicBytesVerified = $publicBytesVerified
                pendingStateQuery = 'complete digest-bound provider search, then protected release ledger'
              }
            }
            if (-not [string]::IsNullOrWhiteSpace($reason)) { $evidence.reason = $reason }
            $evidence | ConvertTo-Json -Depth 8 | Out-File winget-evidence.json -Encoding utf8
          }

          function Get-WinGetState($mode = $null, $retryUnavailable = $false) {
              $arguments = @('cli/scripts/release/winget-submission.js', $manifestDirectory, $env:RELEASE_TAG, 'winget-provider.json')
              if ($null -ne $mode) { $arguments += [string]$mode }
              $result = & node @arguments
              if ($LASTEXITCODE -eq 0) {
                $state = $result | Out-String | ConvertFrom-Json
                $script:verifiedWinGet = if ($state.publicExact) { $state.publication } else { $state.submission }
                return $state
              }
              if ($LASTEXITCODE -eq 75 -and $retryUnavailable) { throw [System.IO.IOException]::new('WinGet verification temporarily unavailable') }
              throw 'WinGet public manifest integrity conflict or verification unavailable'
          }
          function Find-WinGetPullRequest($retryUnavailable = $false) {
            $result = Get-WinGetState $null $retryUnavailable
            if ($result.submitRequired) { return $null }
            return $result.submission
          }

          $publicState = Get-WinGetState '--public'
          if ($publicState.publicExact) {
            $catalogCommit = $publicState.publication.headCommit
            Write-WinGetEvidence 'public-exact' "github:microsoft/winget-pkgs@$catalogCommit#$manifestPath" $null $catalogCommit $true
            exit 0
          }

          git fetch origin release-ledger
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch protected release ledger' }
          $ledgerPath = "events/$($env:RELEASE_TAG).jsonl"
          $ledgerEntry = git ls-tree --name-only origin/release-ledger -- $ledgerPath
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect protected release ledger' }
          if (-not [string]::IsNullOrWhiteSpace(($ledgerEntry | Out-String))) {
            $ledgerLines = git show "origin/release-ledger:$ledgerPath"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read protected release ledger' }
            $existing = $ledgerLines | ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object {
                $_.channel -eq 'winget' -and $_.type -in @(
                  'channel_submitted', 'channel_accepted', 'channel_rejected', 'channel_corrected', 'channel_resubmitted'
                )
              } | Select-Object -Last 1
            if ($null -ne $existing) {
              if ($null -eq $existing.payload.submission) {
                throw 'WinGet protected-ledger evidence is incomplete'
              }
              $recordedPull = $existing.payload.submission.provider.pullRequest
              if ($null -eq $recordedPull -or $recordedPull -le 0) {
                throw 'WinGet protected-ledger pull request identity is invalid'
              }
              $pullRequest = (Get-WinGetState $recordedPull).submission
              if ($null -eq $pullRequest) { throw 'Recorded WinGet pull request cannot be verified' }
              if ($existing.payload.remoteDigest -ne $pullRequest.remoteDigest) {
                throw 'WinGet protected-ledger digest conflicts with authenticated provider manifests'
              }
              $remoteIdentity = "github:microsoft/winget-pkgs/pull/$($pullRequest.pullRequest)@$($pullRequest.headCommit)#$manifestPath"
              if ($pullRequest.state -eq 'MERGED') {
                Write-WinGetEvidence 'accepted' $remoteIdentity $($pullRequest.pullRequest) $($pullRequest.headCommit) $false
                exit 0
              }
              if ($pullRequest.state -eq 'CLOSED') {
                $reason = 'provider pull request closed without merge'
                Write-WinGetEvidence 'rejected' $remoteIdentity $($pullRequest.pullRequest) $($pullRequest.headCommit) $false $reason
                exit 0
              }
              if ($existing.type -eq 'channel_rejected') {
                throw 'WinGet submission was rejected; record a correction before resubmission'
              }
              $state = if ($existing.type -eq 'channel_corrected') {
                'resubmitted'
              } else { 'pending-ledger' }
              Write-WinGetEvidence $state $remoteIdentity $($pullRequest.pullRequest) $($pullRequest.headCommit) $false
              Write-Host 'WinGet provider state was resolved from the recorded pull request; the protected release ledger prevents a blind duplicate.'
              exit 0
            }
          }

          $pullTitle = "GuardScan $version [$($manifestDigest.Substring(0, 12))]"
          $pullRequest = Find-WinGetPullRequest
          if ($null -ne $pullRequest) {
            $state = if ($pullRequest.state -eq 'MERGED') { 'accepted' } else { 'pending' }
            Write-WinGetEvidence $state "github:microsoft/winget-pkgs/pull/$($pullRequest.pullRequest)@$($pullRequest.headCommit)#$manifestPath" $($pullRequest.pullRequest) $($pullRequest.headCommit) $false
            exit 0
          }

          $wingetCreateUrl = "https://github.com/microsoft/winget-create/releases/download/v$env:RELEASE_WINGETCREATE_VERSION/wingetcreate.exe"
          Invoke-WebRequest $wingetCreateUrl -OutFile wingetcreate.exe
          $wingetCreateDigest = (Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($wingetCreateDigest -ne $env:RELEASE_WINGETCREATE_SHA256) {
            throw 'Pinned wingetcreate executable failed SHA-256 verification'
          }
          $submitStatus = 1
          try {
            & .\wingetcreate.exe submit --prtitle "$pullTitle" --no-open --token $env:WINGET_GITHUB_TOKEN $manifestDirectory
            $submitStatus = $LASTEXITCODE
          } catch [System.IO.IOException] {
            Write-Host 'WinGet submission transport outcome is unknown; verifying exact provider state.'
          }
          for ($attempt = 0; $attempt -lt 30; $attempt += 1) {
            try { $pullRequest = Find-WinGetPullRequest $true }
            catch [System.IO.IOException] { $pullRequest = $null }
            if ($null -ne $pullRequest) { break }
            Start-Sleep -Seconds 10
          }
          if ($null -eq $pullRequest) { throw "Submitted WinGet pull request identity did not become queryable (submit status $submitStatus)" }
          $state = if ($pullRequest.state -eq 'MERGED') { 'accepted' } else { 'submitted' }
          Write-WinGetEvidence $state "github:microsoft/winget-pkgs/pull/$($pullRequest.pullRequest)@$($pullRequest.headCommit)#$manifestPath" $($pullRequest.pullRequest) $($pullRequest.headCommit) $false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-winget-evidence-${{ inputs.tag }}
          path: winget-evidence.json
          if-no-files-found: error
          retention-days: 30

  chocolatey:
    name: Chocolatey submission
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true' && inputs.channel == 'stable'
    runs-on: windows-2025
    needs: [github]
    environment: chocolatey
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-payload-${{ inputs.tag }}
          path: payload
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - working-directory: cli
        run: npm ci --ignore-scripts
      - name: Render Chocolatey adapter with trusted tooling
        run: |
          node cli/scripts/release/index.js render --manifest payload/release-manifest.json --output-dir adapters --package-root "$GITHUB_WORKSPACE/source/cli" --repository-root "$GITHUB_WORKSPACE/source" --schema-root "$GITHUB_WORKSPACE/cli"
      - name: Pack and test Chocolatey install, upgrade, invoke, and uninstall from a local feed
        shell: pwsh
        run: |
          if ($null -eq (Get-Command choco -ErrorAction SilentlyContinue)) {
            throw 'Chocolatey is unavailable on the selected Windows runner'
          }
          New-Item -ItemType Directory -Force local-feed | Out-Null
          Push-Location cli\__tests__\fixtures\chocolatey-prior
          choco pack guardscan.nuspec --output-directory ..\..\..\..\local-feed
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey prior-version fixture creation failed' }
          Pop-Location
          Push-Location adapters\chocolatey
          choco pack guardscan.nuspec --output-directory ..\..\local-feed
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey package creation failed' }
          Pop-Location
          $feed = Resolve-Path local-feed
          choco install guardscan --source "$feed" --version 1.0.5 --yes
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey prior-version installation failed' }
          $priorVersion = (& guardscan --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $priorVersion -ne '1.0.5') {
            throw 'Chocolatey prior-version fixture invocation failed'
          }
          $candidateVersion = ($env:RELEASE_INPUT_TAG).TrimStart('v')
          choco upgrade guardscan --source "$feed" --version "$candidateVersion" --yes
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey local-feed upgrade failed' }
          $installedVersion = (& guardscan --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $installedVersion -ne ($env:RELEASE_INPUT_TAG).TrimStart('v')) {
            throw 'Chocolatey local-feed invocation or version check failed'
          }
          choco uninstall guardscan --yes
          if ($LASTEXITCODE -ne 0) { throw 'Chocolatey local-feed uninstall failed' }
      - name: Preflight and submit Chocolatey package with exact evidence
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_TAG.TrimStart('v')
          $package = Get-Item -LiteralPath "local-feed/guardscan.$version.nupkg"
          if ($package.PSIsContainer) { throw 'Chocolatey package is not a regular file' }
          function Get-PublicationState($retryUnavailable = $false) {
              $result = & python cli/scripts/release/chocolatey-preflight.py --package $package.FullName --version $version
              if ($LASTEXITCODE -eq 0) { return ($result | Out-String | ConvertFrom-Json) }
              if ($LASTEXITCODE -eq 75 -and $retryUnavailable) { throw [System.IO.IOException]::new('Chocolatey verification temporarily unavailable') }
              throw 'Chocolatey public package integrity conflict or verification unavailable'
          }
          $publicationState = Get-PublicationState
          $packageDigest = $publicationState.payloadDigest
          $packageIdentity = "guardscan@$version"
          $publicUrl = "https://community.chocolatey.org/api/v2/package/guardscan/$version"

          function Write-ChocolateyEvidence($state, $remoteIdentity, $publicBytesVerified, $reason = $null) {
            $evidence = [ordered]@{
              schemaVersion = 'guardscan.moderated-submission.v1'
              channel = 'chocolatey'
              version = $version
              tag = $env:RELEASE_TAG
              state = $state
              packageIdentity = $packageIdentity
              packageFilename = $package.Name
              remoteIdentity = $remoteIdentity
              remoteDigest = $packageDigest
              provider = [ordered]@{
                url = $publicUrl
                publicBytesVerified = $publicBytesVerified
                pendingStateQuery = 'public package bytes only; protected release ledger prevents a blind duplicate after recorded submission'
              }
            }
            if (-not [string]::IsNullOrWhiteSpace($reason)) { $evidence.reason = $reason }
            $evidence | ConvertTo-Json -Depth 8 | Out-File chocolatey-evidence.json -Encoding utf8
          }

          if (-not $publicationState.publishRequired) {
            Write-ChocolateyEvidence 'public-exact' $publicUrl $true
            exit 0
          }

          git fetch origin release-ledger
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch protected release ledger' }
          $ledgerPath = "events/$($env:RELEASE_TAG).jsonl"
          $ledgerEntry = git ls-tree --name-only origin/release-ledger -- $ledgerPath
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect protected release ledger' }
          if (-not [string]::IsNullOrWhiteSpace(($ledgerEntry | Out-String))) {
            $ledgerLines = git show "origin/release-ledger:$ledgerPath"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to read protected release ledger' }
            $existing = $ledgerLines | ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object {
                $_.channel -eq 'chocolatey' -and $_.type -in @(
                  'channel_submitted', 'channel_accepted', 'channel_rejected', 'channel_corrected', 'channel_resubmitted'
                )
              } |
              Select-Object -Last 1
            if ($null -ne $existing) {
              if ($existing.payload.remoteDigest -ne $packageDigest) {
                throw 'Chocolatey protected-ledger digest conflicts with rendered package'
              }
              $submission = if ($null -ne $existing.payload.submission) {
                $existing.payload.submission
              } else {
                ($ledgerLines | ForEach-Object { $_ | ConvertFrom-Json } |
                  Where-Object { $_.channel -eq 'chocolatey' -and $null -ne $_.payload.submission } |
                  Select-Object -Last 1).payload.submission
              }
              if ($null -eq $submission) {
                throw 'Chocolatey protected-ledger evidence is incomplete'
              }
              $submittedAt = [DateTimeOffset]::Parse($existing.timestamp)
              if ($existing.type -eq 'channel_rejected') {
                $reason = $existing.payload.reason ?? 'provider moderation requires maintainer correction'
                Write-ChocolateyEvidence 'rejected' "chocolatey:$packageIdentity" $false $reason
                exit 0
              }
              if (([DateTimeOffset]::UtcNow - $submittedAt).TotalDays -ge 35) {
                $reason = 'public package remained absent through the documented 35-day no-response moderation window; maintainer confirmation is required'
                Write-ChocolateyEvidence 'rejected' "chocolatey:$packageIdentity" $false $reason
                exit 0
              }
              $submission | ConvertTo-Json -Depth 8 | Out-File chocolatey-evidence.json -Encoding utf8
              Write-Host 'Chocolatey pending moderation cannot be queried reliably; the protected release ledger prevents a blind duplicate.'
              exit 0
            }
          }

          $submitStatus = 1
          try {
            choco push $package.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
            $submitStatus = $LASTEXITCODE
          } catch [System.IO.IOException] {
            Write-Host 'Chocolatey submission transport outcome is unknown; verifying exact provider state.'
          }
          if ($submitStatus -ne 0) {
            for ($attempt = 0; $attempt -lt 30; $attempt += 1) {
              try { $publicationState = Get-PublicationState $true }
              catch [System.IO.IOException] { Start-Sleep -Seconds 10; continue }
              if (-not $publicationState.publishRequired) {
                Write-ChocolateyEvidence 'public-exact' $publicUrl $true
                exit 0
              }
              Start-Sleep -Seconds 10
            }
            throw 'Chocolatey package did not converge after failed submission'
          }
          Write-ChocolateyEvidence 'submitted' "chocolatey:$packageIdentity" $false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-chocolatey-evidence-${{ inputs.tag }}
          path: chocolatey-evidence.json
          if-no-files-found: error
          retention-days: 30
