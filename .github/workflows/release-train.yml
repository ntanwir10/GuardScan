            cd ledger-branch
            git add events active-versions.json recoveries
            if git diff --cached --quiet; then
              echo 'Rollback completion already persisted.'
            else
              git commit -m "rollback repository recovery complete: v$DEFECTIVE_VERSION"
            fi
            git -c "http.extraheader=AUTHORIZATION: bearer $RELEASE_APP_TOKEN" \
              push origin HEAD:release-ledger
          )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollback-plan-v${{ inputs.version }}
          path: |
            rollback-plan.json
            rollback-evidence.json
          if-no-files-found: error
          retention-days: 90
