              -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" push \
              --force-with-lease="refs/heads/$FORWARD_FIX_BRANCH:$FORWARD_FIX_REMOTE_HEAD" \
              origin "HEAD:refs/heads/$FORWARD_FIX_BRANCH"
          else
            git -C forward-fix-source \
              -c "http.extraheader=AUTHORIZATION: bearer $GH_TOKEN" \
              push origin "HEAD:refs/heads/$FORWARD_FIX_BRANCH"
